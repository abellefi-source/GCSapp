                <div style={{fontSize:"14px",color:"#e2e8f0",fontWeight:600}}>{previewFile.name}</div>
                {previewFile.caption&&<div style={{fontSize:"12px",color:"#f97316",marginTop:"2px"}}>{previewFile.caption}</div>}
              </div>
              <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
                <button onClick={()=>{fileApi.open(previewFile.storedName||previewFile.name);}} style={{background:"#1e2a35",border:"none",borderRadius:"6px",padding:"6px 12px",color:"#60a5fa",fontSize:"12px",cursor:"pointer"}}>Open External</button>
                <button onClick={()=>setPreviewFile(null)} style={{background:"none",border:"none",color:"#e2e8f0",fontSize:"24px",cursor:"pointer",padding:"0 4px"}}>✕</button>
              </div>
            </div>
            <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",overflow:"auto",padding:"0 20px 20px"}} onClick={e=>e.stopPropagation()}>
              {previewFile.type==="image"?
                <img src={previewFile.url} style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain",borderRadius:"4px"}} alt={previewFile.name}/>:
                <iframe src={previewFile.url} style={{width:"100%",height:"100%",border:"none",borderRadius:"8px",background:"#fff"}}/>
              }
            </div>
          </div>
        )}
      </>);
    }

    // ─── MAP COMPONENT ───────────────────────────────────────────────
    function ServiceMap({customers,jobs}){
      const mapRef=useRef(null);
      const mapInst=useRef(null);
      const markersRef=useRef([]);
      const routeRef=useRef(null);
      const[routeInfo,setRouteInfo]=useState(null);
      const[selectedForRoute,setSelectedForRoute]=useState([]);
      const[mapFilter,setMapFilter]=useState("active");
      const geocodeCache=useRef({});
      const[markers,setMarkers]=useState([]);
      // Home base & saved locations
      const[savedLocs,setSavedLocs]=useState(()=>{try{return JSON.parse(localStorage.getItem("gcs_map_locations")||"[]");}catch(e){return[];}});
      const[showLocEditor,setShowLocEditor]=useState(false);
      const[editLoc,setEditLoc]=useState({name:"",address:"",isHome:false});

      const saveLocs=(locs)=>{setSavedLocs(locs);localStorage.setItem("gcs_map_locations",JSON.stringify(locs));};
      const homeBase=savedLocs.find(l=>l.isHome);

      const addSavedLoc=async()=>{
        if(!editLoc.name||!editLoc.address)return;
        // Geocode
        try{
          const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(editLoc.address)}&format=json&limit=1`);
          const d=await r.json();
          if(d&&d[0]){
            const loc={...editLoc,lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon),id:Date.now()};
            if(loc.isHome){const locs=savedLocs.map(l=>({...l,isHome:false}));saveLocs([...locs,loc]);}
            else{saveLocs([...savedLocs,loc]);}
            setEditLoc({name:"",address:"",isHome:false});setShowLocEditor(false);
          }else{alert("Could not find address");}
        }catch(e){alert("Geocode error: "+e.message);}
      };

      const deleteLoc=(id)=>{saveLocs(savedLocs.filter(l=>l.id!==id));};

      useEffect(()=>{
        if(!mapRef.current||mapInst.current)return;
        const center=homeBase?[homeBase.lat,homeBase.lng]:[29.76,-95.37];
        mapInst.current=L.map(mapRef.current,{zoomControl:true}).setView(center,11);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:18}).addTo(mapInst.current);
        return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
      },[]);

      useEffect(()=>{
        const geocode=async()=>{
          const locs=[];
          // Add saved locations
          savedLocs.forEach(sl=>{
            if(sl.lat&&sl.lng)locs.push({...sl,type:"saved",name:sl.isHome?`🏠 ${sl.name}`:sl.name});
          });
          let filteredJobs=[];
          if(mapFilter==="inroute")filteredJobs=jobs.filter(j=>j.serviceAddress&&j.status==="In Route");
          else if(mapFilter==="active")filteredJobs=jobs.filter(j=>j.serviceAddress&&(j.status==="In Route"||j.status==="In Progress"||j.status==="Scheduled"));
          else filteredJobs=jobs.filter(j=>j.serviceAddress&&j.status!=="Completed"&&j.status!=="Cancelled");
          for(const j of filteredJobs){
            const key=j.serviceAddress;
            if(geocodeCache.current[key]){locs.push({...geocodeCache.current[key],name:`${j.id}: ${j.vehicle}`,type:"job",status:j.status,address:j.serviceAddress,customer:j.customer});continue;}
            try{
              const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(j.serviceAddress)}&format=json&limit=1`);
              const d=await r.json();
              if(d&&d[0]){const coord={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};geocodeCache.current[key]=coord;locs.push({...coord,name:`${j.id}: ${j.vehicle}`,type:"job",status:j.status,address:j.serviceAddress,customer:j.customer});}
            }catch(e){}
            await new Promise(r=>setTimeout(r,1100));
          }
          for(const c of customers){
            if(!c.address)continue;
            const key=c.address;
            if(geocodeCache.current[key]){locs.push({...geocodeCache.current[key],name:c.name,type:"customer",address:c.address});continue;}
            try{
              const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(c.address)}&format=json&limit=1`);
              const d=await r.json();
              if(d&&d[0]){const coord={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};geocodeCache.current[key]=coord;locs.push({...coord,name:c.name,type:"customer",address:c.address});}
            }catch(e){}
            await new Promise(r=>setTimeout(r,1100));
          }
          setMarkers(locs);
        };
        geocode();
      },[customers,jobs,mapFilter,savedLocs]);

      useEffect(()=>{
        if(!mapInst.current)return;
        markersRef.current.forEach(m=>m.remove());
        markersRef.current=[];
        markers.forEach((m,i)=>{
          const color=m.type==="saved"?(m.isHome?"#f97316":"#a855f7"):m.type==="customer"?"#60a5fa":m.status==="In Route"?"#0ea5e9":m.status==="In Progress"?"#22c55e":"#f97316";
          const size=m.type==="saved"&&m.isHome?16:12;
          const icon=L.divIcon({className:"",html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid #0a0e13;box-shadow:0 0 8px ${color}80"></div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});
          const marker=L.marker([m.lat,m.lng],{icon}).addTo(mapInst.current);
          const statusTag=m.status?`<br/><span style="color:${color};font-weight:600;font-size:11px">${m.status}</span>`:"";
          const savedTag=m.type==="saved"?`<br/><span style="color:#a855f7;font-size:10px">${m.isHome?"Home Base":"Saved Location"}</span>`:"";
          marker.bindPopup(`<div style="font-family:sans-serif;font-size:12px"><b>${m.name}</b>${statusTag}${savedTag}<br/><span style="color:#666">${m.address||""}</span>${m.type!=="saved"?`<br/><button onclick="window.__addToRoute(${i})" style="margin-top:4px;padding:2px 8px;border:1px solid #ccc;border-radius:4px;cursor:pointer;font-size:11px">+ Route</button>`:""}</div>`);
          markersRef.current.push(marker);
        });
        if(markers.length>0){mapInst.current.fitBounds(L.latLngBounds(markers.map(m=>[m.lat,m.lng])),{padding:[40,40]});}
      },[markers]);

      window.__addToRoute=(i)=>{setSelectedForRoute(prev=>prev.includes(i)?prev:[...prev,i]);};
      const addAllToRoute=()=>{
        const idxs=[];
        // Start with home base if exists
        const homeIdx=markers.findIndex(m=>m.type==="saved"&&m.isHome);
        if(homeIdx>=0)idxs.push(homeIdx);
        markers.forEach((_,i)=>{if(markers[i].type==="job"&&!idxs.includes(i))idxs.push(i);});
        // End at home
        if(homeIdx>=0&&idxs[idxs.length-1]!==homeIdx)idxs.push(homeIdx);
        setSelectedForRoute(idxs);
      };

      const calcRoute=async()=>{
        if(selectedForRoute.length<2)return;
        if(routeRef.current){routeRef.current.remove();routeRef.current=null;}
        const pts=selectedForRoute.map(i=>markers[i]);
        const coords=pts.map(p=>`${p.lng},${p.lat}`).join(";");
        try{
          const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
          const d=await r.json();
          if(d.routes&&d.routes[0]){
            const route=d.routes[0];
            routeRef.current=L.geoJSON(route.geometry,{style:{color:"#f97316",weight:4,opacity:0.8}}).addTo(mapInst.current);
            mapInst.current.fitBounds(routeRef.current.getBounds(),{padding:[40,40]});
            setRouteInfo({distance:(route.distance/1609.34).toFixed(1),duration:Math.round(route.duration/60)});
          }
        }catch(e){console.error("Route error:",e);}
      };

      const clearRoute=()=>{if(routeRef.current){routeRef.current.remove();routeRef.current=null;}setSelectedForRoute([]);setRouteInfo(null);};
      const inRouteCount=jobs.filter(j=>j.status==="In Route").length;

      return(
        <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px",flexWrap:"wrap",gap:"8px"}}>
            <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
              <h3 style={{margin:0,fontSize:"14px",color:"#94a3b8"}}>Service Map</h3>
              <div style={{display:"flex",gap:"2px"}}>
                {[{k:"inroute",l:`In Route (${inRouteCount})`},{k:"active",l:"Active"},{k:"all",l:"All"}].map(f=>(
                  <button key={f.k} onClick={()=>setMapFilter(f.k)} style={{background:mapFilter===f.k?"#1e2a35":"transparent",border:"none",borderRadius:"4px",padding:"3px 8px",color:mapFilter===f.k?"#e2e8f0":"#475569",fontSize:"10px",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>{f.l}</button>
                ))}
              </div>
            </div>
            <div style={{display:"flex",gap:"6px",alignItems:"center",flexWrap:"wrap"}}>
              {homeBase&&<span style={{fontSize:"10px",color:"#f97316",fontFamily:"'DM Mono',monospace"}}>🏠 {homeBase.name}</span>}
              {selectedForRoute.length>0&&<span style={{fontSize:"11px",color:"#f97316",fontFamily:"'DM Mono',monospace"}}>{selectedForRoute.length} stops</span>}
              {routeInfo&&<span style={{fontSize:"11px",color:"#4ade80",fontFamily:"'DM Mono',monospace"}}>{routeInfo.distance} mi · {routeInfo.duration} min</span>}
              <button onClick={addAllToRoute} style={{...btnSecondary,padding:"5px 10px",fontSize:"10px"}}>{homeBase?"Route from Home":"Add All"}</button>
              <button onClick={calcRoute} disabled={selectedForRoute.length<2} style={{...btnPrimary,padding:"5px 10px",fontSize:"11px",opacity:selectedForRoute.length<2?0.4:1}}>Calculate Route</button>
              <button onClick={clearRoute} style={{...btnSecondary,padding:"5px 10px",fontSize:"11px"}}>Clear</button>
              <button onClick={()=>setShowLocEditor(!showLocEditor)} style={{...btnSecondary,padding:"5px 10px",fontSize:"10px",color:"#a855f7"}}>{showLocEditor?"✕":"📍 Locations"}</button>
            </div>
          </div>

          {showLocEditor&&(
            <div style={{background:"#111820",border:"1px solid #1e2a35",borderRadius:"8px",padding:"14px",marginBottom:"10px"}}>
              <div style={{fontSize:"11px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"10px",fontFamily:"'DM Mono',monospace"}}>Saved Locations</div>
              {savedLocs.map(l=>(
                <div key={l.id} style={{display:"flex",alignItems:"center",gap:"8px",padding:"6px 0",borderBottom:"1px solid #1a2230"}}>
                  <span style={{fontSize:"14px"}}>{l.isHome?"🏠":"📍"}</span>
                  <div style={{flex:1}}><div style={{fontSize:"12px",color:"#e2e8f0",fontWeight:600}}>{l.name}</div><div style={{fontSize:"10px",color:"#475569"}}>{l.address}</div></div>
                  <button onClick={()=>{const locs=savedLocs.map(x=>({...x,isHome:x.id===l.id}));saveLocs(locs);}} style={{background:"none",border:"none",color:l.isHome?"#f97316":"#334155",cursor:"pointer",fontSize:"12px"}} title="Set as home">🏠</button>
                  <button onClick={()=>deleteLoc(l.id)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"12px"}}>✕</button>
                </div>
              ))}
              <div style={{display:"flex",gap:"6px",marginTop:"10px",flexWrap:"wrap"}}>
                <input value={editLoc.name} onChange={e=>setEditLoc(l=>({...l,name:e.target.value}))} placeholder="Name (e.g. Home, Shop)" style={{...inputStyle,flex:"1 1 120px",fontSize:"12px",padding:"8px"}}/>
                <input value={editLoc.address} onChange={e=>setEditLoc(l=>({...l,address:e.target.value}))} placeholder="Address" style={{...inputStyle,flex:"2 1 200px",fontSize:"12px",padding:"8px"}}/>
                <label style={{display:"flex",alignItems:"center",gap:"4px",fontSize:"11px",color:"#94a3b8",cursor:"pointer"}}><input type="checkbox" checked={editLoc.isHome} onChange={e=>setEditLoc(l=>({...l,isHome:e.target.checked}))}/> Home</label>
                <button onClick={addSavedLoc} style={{...btnPrimary,padding:"6px 12px",fontSize:"11px"}}>Save</button>
              </div>
            </div>
          )}

          {selectedForRoute.length>0&&(
            <div style={{display:"flex",gap:"4px",marginBottom:"10px",flexWrap:"wrap"}}>
              {selectedForRoute.map((idx,i)=>(
                <span key={i} style={{background:"#111820",border:"1px solid #1e2a35",borderRadius:"4px",padding:"3px 8px",fontSize:"10px",color:"#94a3b8",fontFamily:"'DM Mono',monospace",display:"inline-flex",alignItems:"center",gap:"4px"}}>
                  {i+1}. {markers[idx]?.name?.slice(0,25)}{markers[idx]?.name?.length>25?"...":""}
                  <button onClick={()=>setSelectedForRoute(prev=>prev.filter(x=>x!==idx))} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:"10px",padding:0}}>✕</button>
                </span>
              ))}
            </div>
          )}
          <div ref={mapRef} style={{height:350,borderRadius:"8px",border:"1px solid #1e2a35"}}/>
          <div style={{display:"flex",gap:"12px",marginTop:"8px"}}>
            <span style={{fontSize:"10px",color:"#475569",display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:8,height:8,borderRadius:"50%",background:"#f97316",display:"inline-block"}}/>Home</span>
            <span style={{fontSize:"10px",color:"#475569",display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:8,height:8,borderRadius:"50%",background:"#a855f7",display:"inline-block"}}/>Saved</span>
            <span style={{fontSize:"10px",color:"#475569",display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:8,height:8,borderRadius:"50%",background:"#0ea5e9",display:"inline-block"}}/>In Route</span>
            <span style={{fontSize:"10px",color:"#475569",display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:8,height:8,borderRadius:"50%",background:"#22c55e",display:"inline-block"}}/>In Progress</span>
            <span style={{fontSize:"10px",color:"#475569",display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:8,height:8,borderRadius:"50%",background:"#f97316",display:"inline-block"}}/>Scheduled</span>
            <span style={{fontSize:"10px",color:"#475569",display:"flex",alignItems:"center",gap:"4px"}}><span style={{width:8,height:8,borderRadius:"50%",background:"#60a5fa",display:"inline-block"}}/>Customers</span>
          </div>
        </div>
      );
    }

    // ─── DASHBOARD ───────────────────────────────────────────────────
    function Dashboard({jobs,customers,onNavigate}){
      const active=jobs.filter(j=>j.status!=="Completed"&&j.status!=="Cancelled");
      const completed=jobs.filter(j=>j.status==="Completed").length;
      const unpaid=jobs.reduce((s,j)=>{const pmt=Array.isArray(j.payments)?j.payments.reduce((a,p)=>a+(p.amount||0),0):0;const bal=(j.amount||0)-pmt;return s+(bal>0?bal:0);},0);
      const revenue=jobs.reduce((s,j)=>{const pmt=Array.isArray(j.payments)?j.payments.reduce((a,p)=>a+(p.amount||0),0):0;return s+pmt;},0);
      const totalBilled=jobs.reduce((s,j)=>s+(j.amount||0),0);
      return(
        <div>
          <div style={{marginBottom:"28px"}}><h1 style={{margin:0,fontSize:"22px",color:"#e2e8f0",fontWeight:700}}>Dashboard</h1><p style={{margin:"4px 0 0",fontSize:"13px",color:"#475569"}}>Good Car Solutions — {new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</p></div>
          <div style={{display:"flex",gap:"14px",flexWrap:"wrap",marginBottom:"28px"}}>
            <MetricCard label="Active Jobs" value={active.length} sub={`${completed} completed total`} accent="#f97316"/>
            <MetricCard label="Revenue Collected" value={`$${revenue.toLocaleString()}`} sub={`$${totalBilled.toLocaleString()} total billed`} accent="#4ade80"/>
            <MetricCard label="Outstanding" value={`$${unpaid.toLocaleString()}`} sub="Remaining balance" accent="#fbbf24"/>
            <MetricCard label="Customers" value={customers.length} sub="Active accounts" accent="#60a5fa"/>
          </div>
          <ServiceMap customers={customers} jobs={jobs}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px",marginTop:"14px"}}>
            <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"20px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}><h3 style={{margin:0,fontSize:"14px",color:"#94a3b8"}}>Active Work Orders</h3><button onClick={()=>onNavigate("jobs")} style={{background:"none",border:"none",color:"#f97316",fontSize:"12px",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>View All →</button></div>
              {active.length===0&&<div style={{color:"#334155",fontSize:"13px",padding:"12px 0"}}>No active jobs</div>}
              {active.slice(0,5).map(j=>(<div key={j.id} style={{padding:"12px 0",borderBottom:"1px solid #111820",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:"13px",color:"#e2e8f0",fontWeight:500}}>{j.vehicle}</div><div style={{fontSize:"11px",color:"#475569",fontFamily:"'DM Mono',monospace",marginTop:"2px"}}>{j.id} · {j.customer}</div></div><StatusBadge status={j.status} balance={jobBal(j)}/></div>))}
            </div>
            <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"20px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}><h3 style={{margin:0,fontSize:"14px",color:"#94a3b8"}}>Top Customers</h3><button onClick={()=>onNavigate("customers")} style={{background:"none",border:"none",color:"#f97316",fontSize:"12px",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>View All →</button></div>
              {customers.length===0&&<div style={{color:"#334155",fontSize:"13px",padding:"12px 0"}}>No customers yet</div>}
              {(()=>{const custRev={};jobs.forEach(j=>{if(j.customer){const pmt=Array.isArray(j.payments)?j.payments.reduce((a,p)=>a+(p.amount||0),0):0;custRev[j.customer]=(custRev[j.customer]||0)+pmt;}});return[...customers].sort((a,b)=>(custRev[b.name]||0)-(custRev[a.name]||0)).slice(0,4).map(c=>{const rev=custRev[c.name]||0;return(<div key={c.id} style={{padding:"12px 0",borderBottom:"1px solid #111820",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:"13px",color:"#e2e8f0",fontWeight:500}}>{c.name}</div><div style={{fontSize:"11px",color:"#475569",fontFamily:"'DM Mono',monospace",marginTop:"2px"}}>{c.type||"No type"} · {jobs.filter(j=>j.customer===c.name).length} jobs</div></div><span style={{fontSize:"13px",color:rev>0?"#4ade80":"#475569",fontFamily:"'DM Mono',monospace",fontWeight:600}}>${rev.toLocaleString()}</span></div>);});})()}

    // ─── JOBS VIEW ───────────────────────────────────────────────────
    function JobsView({jobs,customers,onSelectJob,onNewJob,onUpdateJob}){
      const{types:jobTypes}=useContext(JOB_TYPES_CTX);
      const[filter,setFilter]=useState("All");const[search,setSearch]=useState("");
      const[editCell,setEditCell]=useState(null); // {jobId, field}
      const[editVal,setEditVal]=useState("");
      const editRef=useRef(null);
      const sts=["All","In Route","In Progress","Scheduled","Pending Parts","Completed"];
      const filtered=jobs.filter(j=>(filter==="All"||j.status===filter)&&(search===""||[j.vehicle,j.customer,j.id,j.ecu].join(" ").toLowerCase().includes(search.toLowerCase())));

      useEffect(()=>{if(editRef.current){editRef.current.focus();if(editRef.current.select)editRef.current.select();}},[editCell]);

      const startEdit=(e,jobId,field,currentVal)=>{
        e.stopPropagation();
        setEditCell({jobId,field});
        setEditVal(currentVal||"");
      };
      const saveEdit=()=>{
        if(!editCell)return;
        const{jobId,field}=editCell;
        let val=editVal;
        if(field==="amount")val=Number(editVal)||0;
        if(field==="customer"){
          // If they picked from dropdown, editVal is already the name
          onUpdateJob(jobId,{[field]:val});
        }else{
          onUpdateJob(jobId,{[field]:val});
        }
        setEditCell(null);setEditVal("");
      };
      const cancelEdit=()=>{setEditCell(null);setEditVal("");};
      const handleKey=(e)=>{if(e.key==="Enter")saveEdit();if(e.key==="Escape")cancelEdit();};
      const isEditing=(jid,f)=>editCell?.jobId===jid&&editCell?.field===f;

      const cellEdit=(jid,field)=>({
        fontSize:"12px",padding:"8px 10px",background:"#0a0e13",border:"1px solid #f97316",borderRadius:"4px",color:"#e2e8f0",outline:"none",fontFamily:"'DM Mono',monospace",width:"100%",boxSizing:"border-box"
      });

      const getPaidInfo=(j)=>{
        const payments=Array.isArray(j.payments)?j.payments:[];
        const totalPaid=payments.reduce((s,p)=>s+(p.amount||0),0);
        const amt=j.amount||0;
        if(amt<=0)return{text:"$0",color:"#475569"};
        if(totalPaid>=amt)return{text:`$${amt.toLocaleString()} ✓`,color:"#4ade80"};
        if(totalPaid>0)return{text:`$${totalPaid.toLocaleString()} / $${amt.toLocaleString()}`,color:"#f59e0b"};
        return{text:`$${amt.toLocaleString()} •`,color:"#fbbf24"};
      };

      return(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}}><h1 style={{margin:0,fontSize:"22px",color:"#e2e8f0"}}>Work Orders</h1><button onClick={onNewJob} style={btnPrimary}>+ New Job</button></div>
          <div style={{display:"flex",gap:"10px",marginBottom:"16px",flexWrap:"wrap"}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search jobs..." style={{...inputStyle,flex:1,minWidth:200}}/>
            <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>{sts.map(s=><button key={s} onClick={()=>setFilter(s)} style={{background:filter===s?"#1e2a35":"transparent",border:"1px solid",borderColor:filter===s?"#334155":"#1e2a35",borderRadius:"6px",padding:"7px 14px",color:filter===s?"#e2e8f0":"#475569",fontSize:"12px",cursor:"pointer",fontWeight:filter===s?600:400}}>{s}</button>)}</div>
          </div>
          <div style={{fontSize:"10px",color:"#334155",fontFamily:"'DM Mono',monospace",marginBottom:"8px"}}>Click to open · Double-click cell to edit</div>
          <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",overflow:"hidden"}}><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",minWidth:900}}><thead><tr style={{borderBottom:"1px solid #1e2a35"}}>{["Job ID","Vehicle","Customer","Type","Status","Priority","Payment","Invoice"].map(h=><th key={h} style={{padding:"12px 16px",textAlign:"left",fontSize:"10px",color:"#475569",textTransform:"uppercase",letterSpacing:"1px",fontFamily:"'DM Mono',monospace",fontWeight:600}}>{h}</th>)}</tr></thead><tbody>
            {filtered.map(j=>{const pi=getPaidInfo(j);return(
              <tr key={j.id} onClick={()=>{if(!editCell)onSelectJob(j);}} style={{borderBottom:"1px solid #111820",cursor:"pointer",transition:"background 0.15s"}} onMouseEnter={e=>e.currentTarget.style.background="#111820"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>

                {/* Job ID - not editable */}
                <td style={{padding:"14px 16px",fontSize:"12px",color:"#f97316",fontFamily:"'DM Mono',monospace",fontWeight:600}}>{j.id}</td>

                {/* Vehicle - double-click to edit */}
                <td style={{padding:"14px 16px"}} onDoubleClick={e=>startEdit(e,j.id,"vehicle",j.vehicle)}>
                  {isEditing(j.id,"vehicle")?(<input ref={editRef} value={editVal} onChange={e=>setEditVal(e.target.value)} onBlur={saveEdit} onKeyDown={handleKey} style={cellEdit()}/>):(<div><div style={{fontSize:"13px",color:"#e2e8f0",fontWeight:500}}>{j.vehicle||"—"}</div><div style={{fontSize:"11px",color:"#475569",fontFamily:"'DM Mono',monospace"}}>{j.vin}</div></div>)}
                </td>

                {/* Customer - double-click for dropdown */}
                <td style={{padding:"14px 16px"}} onDoubleClick={e=>startEdit(e,j.id,"customer",j.customer)}>
                  {isEditing(j.id,"customer")?(<select ref={editRef} value={editVal} onChange={e=>{setEditVal(e.target.value);}} onBlur={saveEdit} onKeyDown={handleKey} style={cellEdit()}><option value="">Select...</option>{customers.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}</select>):(<span style={{fontSize:"13px",color:"#94a3b8"}}>{j.customer||"—"}</span>)}
                </td>

                {/* Type - double-click for dropdown */}
                <td style={{padding:"14px 16px"}} onDoubleClick={e=>startEdit(e,j.id,"type",j.type)}>
                  {isEditing(j.id,"type")?(<select ref={editRef} value={editVal} onChange={e=>setEditVal(e.target.value)} onBlur={saveEdit} onKeyDown={handleKey} style={cellEdit()}>{jobTypes.map(t=><option key={t} value={t}>{t}</option>)}</select>):(<span style={{fontSize:"12px",color:"#94a3b8",fontFamily:"'DM Mono',monospace"}}>{j.type}</span>)}
                </td>

                {/* Status - double-click for dropdown */}
                <td style={{padding:"14px 16px"}} onDoubleClick={e=>startEdit(e,j.id,"status",j.status)}>
                  {isEditing(j.id,"status")?(<select ref={editRef} value={editVal} onChange={e=>setEditVal(e.target.value)} onBlur={saveEdit} onKeyDown={handleKey} style={cellEdit()}>{Object.keys(STATUS_COLORS).map(s=><option key={s} value={s}>{s}</option>)}</select>):(<StatusBadge status={j.status} balance={jobBal(j)}/>)}
                </td>

                {/* Priority - double-click for dropdown */}
                <td style={{padding:"14px 16px"}} onDoubleClick={e=>startEdit(e,j.id,"priority",j.priority)}>
                  {isEditing(j.id,"priority")?(<select ref={editRef} value={editVal} onChange={e=>setEditVal(e.target.value)} onBlur={saveEdit} onKeyDown={handleKey} style={cellEdit()}><option>High</option><option>Medium</option><option>Low</option></select>):(<PriorityDot priority={j.priority}/>)}
                </td>

                {/* Payment summary */}
                <td style={{padding:"14px 16px",fontSize:"13px",color:pi.color,fontFamily:"'DM Mono',monospace",fontWeight:600}}>{pi.text}</td>

                {/* Invoice viewed status */}
                <td style={{padding:"14px 16px",fontSize:"12px",fontFamily:"'DM Mono',monospace"}}>
                  {!(j.hasInvoice||j.invoiceNo)?(<span style={{color:"#334155"}}>—</span>):
                   j.invoiceViewCount>0?(
                    <span title={`Viewed ${j.invoiceViewCount}x · Last: ${new Date(j.invoiceViewedAt).toLocaleString()}`} style={{color:"#4ade80",fontWeight:600,display:"inline-flex",alignItems:"center",gap:"4px"}}>
                      <span style={{display:"inline-block",width:"8px",height:"8px",borderRadius:"50%",background:"#4ade80"}}></span>
                      Viewed{j.invoiceViewCount>1?` (${j.invoiceViewCount})`:""}</span>
                  ):(<span style={{color:"#f59e0b",fontWeight:600,display:"inline-flex",alignItems:"center",gap:"4px"}}>
                      <span style={{display:"inline-block",width:"8px",height:"8px",borderRadius:"50%",background:"#f59e0b"}}></span>
                      Not Viewed</span>)}
                </td>
              </tr>
            );})}
          </tbody></table></div>{filtered.length===0&&<div style={{padding:"40px",textAlign:"center",color:"#475569",fontSize:"14px"}}>No matching work orders</div>}</div>
        </div>
      );
    }

    // ─── CUSTOMERS VIEW ──────────────────────────────────────────────
    function EditCustomerModal({customer,onClose,onSave}){
      const[form,setForm]=useState({name:customer.name||"",contact:customer.contact||"",phone:customer.phone||"",email:customer.email||"",address:customer.address||"",type:customer.type||"Independent Shop",notes:customer.notes||""});
      const save=async()=>{await onSave(customer.id,form);onClose();};
      return(<Modal onClose={onClose} title="Edit Customer" width={520}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
          <FormField label="Name"><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} style={inputStyle}/></FormField>
          <FormField label="Contact Person"><input value={form.contact} onChange={e=>setForm(f=>({...f,contact:e.target.value}))} placeholder="Contact name" style={inputStyle}/></FormField>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
          <FormField label="Phone"><input value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="(555) 123-4567" style={inputStyle}/></FormField>
          <FormField label="Email"><input value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="email@example.com" style={inputStyle}/></FormField>
        </div>
        <FormField label="Address"><input value={form.address} onChange={e=>setForm(f=>({...f,address:e.target.value}))} placeholder="Street address, City, State" style={inputStyle}/></FormField>
        <FormField label="Type">
          <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))} style={inputStyle}>
            {CUSTOMER_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
        </FormField>
        <FormField label="Notes"><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={3} placeholder="Notes about this customer..." style={{...inputStyle,resize:"vertical"}}/></FormField>
        <div style={{display:"flex",gap:"10px",justifyContent:"flex-end",marginTop:"6px"}}>
          <button onClick={onClose} style={btnSecondary}>Cancel</button>
          <button onClick={save} style={btnPrimary}>Save Changes</button>
        </div>
      </Modal>);
    }

    function CustomersView({customers,jobs,onNewCustomer,onUpdateCustomer,onDeleteCustomer,onSelectJob}){
      const[sel,setSel]=useState(null);
      const[editCust,setEditCust]=useState(null);
      const getCustomerJobs=(name)=>jobs.filter(j=>j.customer===name);
      return(
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}}><h1 style={{margin:0,fontSize:"22px",color:"#e2e8f0"}}>Customers</h1><button onClick={onNewCustomer} style={btnPrimary}>+ New Customer</button></div>
          {customers.length===0&&<div style={{padding:"40px",textAlign:"center",color:"#475569",fontSize:"14px",background:"#0f1419",borderRadius:"10px",border:"1px solid #1e2a35"}}>No customers yet</div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(360px,1fr))",gap:"14px"}}>
            {customers.map(c=>{
              const cJobs=getCustomerJobs(c.name);
              const cRevenue=cJobs.reduce((s,j)=>s+(j.amount||0),0);
              const cActive=cJobs.filter(j=>j.status!=="Completed"&&j.status!=="Cancelled");
              return(<div key={c.id} onClick={()=>setSel(sel?.id===c.id?null:c)} style={{background:"#0f1419",border:"1px solid",borderColor:sel?.id===c.id?"#f97316":"#1e2a35",borderRadius:"10px",padding:"20px",cursor:"pointer",transition:"border-color 0.2s"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px"}}><div><div style={{fontSize:"15px",color:"#e2e8f0",fontWeight:600}}>{c.name}</div><div style={{fontSize:"12px",color:"#475569",marginTop:"2px"}}>{c.contact} · {c.type}</div></div><span style={{fontSize:"16px",color:"#4ade80",fontFamily:"'DM Mono',monospace",fontWeight:700}}>${cRevenue.toLocaleString()}</span></div>
                {c.address&&<div style={{fontSize:"11px",color:"#64748b",fontFamily:"'DM Mono',monospace",marginBottom:"6px"}}>📍 <AddressLink address={c.address}/></div>}
                <div style={{display:"flex",gap:"16px"}}><span style={{fontSize:"11px",color:"#64748b",fontFamily:"'DM Mono',monospace"}}>{cJobs.length} jobs</span>{cActive.length>0&&<span style={{fontSize:"11px",color:"#f97316",fontFamily:"'DM Mono',monospace"}}>{cActive.length} active</span>}</div>

                {sel?.id===c.id&&(<div style={{borderTop:"1px solid #1e2a35",paddingTop:"12px",marginTop:"10px"}}>
                  <div style={{display:"flex",gap:"12px",flexWrap:"wrap",marginBottom:"10px"}}>{c.phone&&<span style={{fontSize:"11px",color:"#60a5fa",fontFamily:"'DM Mono',monospace"}}>{c.phone}</span>}{c.email&&<span style={{fontSize:"11px",color:"#60a5fa",fontFamily:"'DM Mono',monospace"}}>{c.email}</span>}</div>
                  {c.notes&&<div style={{fontSize:"12px",color:"#94a3b8",lineHeight:1.5,marginBottom:"12px"}}>{c.notes}</div>}

                  {/* Linked Jobs */}
                  {cJobs.length>0&&(<div style={{marginBottom:"12px"}}>
                    <div style={{fontSize:"10px",color:"#475569",textTransform:"uppercase",letterSpacing:"1px",fontFamily:"'DM Mono',monospace",marginBottom:"8px"}}>Work Orders ({cJobs.length})</div>
                    <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                      {cJobs.slice(0,8).map(j=>(
                        <div key={j.id} onClick={e=>{e.stopPropagation();onSelectJob(j);}} style={{background:"#0a0e13",border:"1px solid #111820",borderRadius:"6px",padding:"10px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",transition:"border-color 0.15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor="#1e2a35"} onMouseLeave={e=>e.currentTarget.style.borderColor="#111820"}>
                          <div>
                            <div style={{fontSize:"12px",color:"#e2e8f0",fontWeight:500}}>{j.vehicle}</div>
                            <div style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace",marginTop:"2px"}}>{j.id} · {j.type}</div>
                          </div>
                          <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
                            <StatusBadge status={j.status} balance={jobBal(j)}/>
                            {(()=>{const pays=Array.isArray(j.payments)?j.payments.reduce((s,p)=>s+(p.amount||0),0):0;const amt=j.amount||0;const full=amt>0&&pays>=amt;return <span style={{fontSize:"12px",color:full?"#4ade80":pays>0?"#f59e0b":"#fbbf24",fontFamily:"'DM Mono',monospace",fontWeight:600}}>{full?`$${amt.toLocaleString()} ✓`:pays>0?`$${pays.toLocaleString()}/$${amt.toLocaleString()}`:`$${amt.toLocaleString()}`}</span>;})()}
                          </div>
                        </div>
                      ))}
                      {cJobs.length>8&&<div style={{fontSize:"11px",color:"#475569",fontFamily:"'DM Mono',monospace",padding:"4px 0"}}>+{cJobs.length-8} more</div>}
                    </div>
                  </div>)}
                  {cJobs.length===0&&<div style={{fontSize:"12px",color:"#334155",fontFamily:"'DM Mono',monospace",marginBottom:"12px"}}>No work orders yet</div>}

                  <div style={{display:"flex",gap:"8px"}}><button onClick={e=>{e.stopPropagation();setEditCust(c);}} style={{...btnSecondary,padding:"6px 14px",fontSize:"11px"}}>✎ Edit</button><button onClick={e=>{e.stopPropagation();if(confirm(`Delete ${c.name}?`))onDeleteCustomer(c.id);}} style={{...btnDanger,padding:"6px 14px",fontSize:"11px"}}>Delete Customer</button></div>
                </div>)}
              </div>);
            })}
          </div>
          {editCust&&<EditCustomerModal customer={editCust} onClose={()=>setEditCust(null)} onSave={onUpdateCustomer}/>}
        </div>
      );
    }

    // ─── KNOWLEDGE BASE ──────────────────────────────────────────────
    function KnowledgeBase({knowledgeBase,onAddEntry,onDeleteEntry}){

        <div style={{display:"flex",gap:"6px",marginBottom:"20px"}}>{Object.entries(cats).map(([k,l])=><button key={k} onClick={()=>setCat(k)} style={{background:cat===k?"#f97316":"#0f1419",border:"1px solid",borderColor:cat===k?"#f97316":"#1e2a35",borderRadius:"8px",padding:"8px 16px",color:cat===k?"#0a0e13":"#64748b",fontSize:"13px",cursor:"pointer",fontWeight:cat===k?700:400}}>{l}</button>)}</div>

      </div>);
    }

    // ─── VEHICLES DB ─────────────────────────────────────────────────
    function VehicleDatabase({vehicles,jobs,customers,onAddVehicle,onDeleteVehicle,isServer}){
      const[search,setSearch]=useState("");
      const[selected,setSelected]=useState(null);
      const fileApi=isServer?api.server.files:api.files;

      // Build vehicle history from jobs - group by VIN or vehicle name
      const vehicleMap=useMemo(()=>{
        const map={};
        for(const j of jobs){
          if(!j.vehicle)continue;
          const key=j.vin?j.vin.toUpperCase().trim():(j.vehicle||"").trim();
          if(!key)continue;
          if(!map[key])map[key]={vehicle:j.vehicle,vin:j.vin||"",customers:new Set(),jobs:[],files:[],firstDate:j.date||j.createdAt||"",lastDate:j.date||j.createdAt||""};
          map[key].jobs.push(j);
          if(j.customer)map[key].customers.add(j.customer);
          // Use the most descriptive vehicle name
          if(j.vehicle&&j.vehicle.length>map[key].vehicle.length)map[key].vehicle=j.vehicle;
          if(j.vin)map[key].vin=j.vin;
          // Collect files from timeline
          const timeline=Array.isArray(j.notes)?j.notes:[];
          for(const entry of timeline){
            if(entry.type==="file"&&entry.file){
              map[key].files.push({...entry.file,jobId:j.id,timestamp:entry.timestamp});
            }
          }
          // Track date range
          const d=j.date||j.createdAt||"";
          if(d&&d<map[key].firstDate)map[key].firstDate=d;
          if(d&&d>map[key].lastDate)map[key].lastDate=d;
        }
        // Sort jobs within each vehicle by date desc
        for(const v of Object.values(map)){
          v.jobs.sort((a,b)=>(b.date||b.createdAt||"").localeCompare(a.date||a.createdAt||""));
          v.files.sort((a,b)=>(b.timestamp||"").localeCompare(a.timestamp||""));
          v.customerList=[...v.customers];
          v.totalBilled=v.jobs.reduce((s,j)=>s+(j.amount||0),0);
          v.totalPaid=v.jobs.reduce((s,j)=>{const p=Array.isArray(j.payments)?j.payments.reduce((a,pm)=>a+(pm.amount||0),0):0;return s+p;},0);
        }
        return map;
      },[jobs]);

      const vehicleList=Object.entries(vehicleMap).map(([key,v])=>({key,...v}));
      const filtered=vehicleList.filter(v=>search===""||
        v.vehicle.toLowerCase().includes(search.toLowerCase())||
        v.vin.toLowerCase().includes(search.toLowerCase())||
        v.customerList.some(c=>c.toLowerCase().includes(search.toLowerCase()))
      ).sort((a,b)=>(b.lastDate||"").localeCompare(a.lastDate||""));

      if(selected){
        const v=vehicleMap[selected];
        if(!v)return <div style={{color:"#475569"}}>Vehicle not found</div>;
        return(
          <div>
            <button onClick={()=>setSelected(null)} style={{...btnSecondary,marginBottom:"16px",fontSize:"12px"}}>← Back to Vehicles</button>
            <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"24px",marginBottom:"14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px"}}>
                <div>
                  <h2 style={{margin:0,fontSize:"20px",color:"#e2e8f0"}}>{v.vehicle}</h2>
                  {v.vin&&<div style={{fontSize:"13px",color:"#f97316",fontFamily:"'DM Mono',monospace",marginTop:"4px"}}>VIN: {v.vin}</div>}
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:"11px",color:"#475569",fontFamily:"'DM Mono',monospace"}}>{v.jobs.length} job{v.jobs.length!==1?"s":""}</div>
                  <div style={{fontSize:"13px",color:"#4ade80",fontFamily:"'DM Mono',monospace",fontWeight:600}}>${v.totalPaid.toLocaleString()} paid</div>
                </div>
              </div>
              <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"8px"}}>
                {v.customerList.map(c=><span key={c} style={{background:"#111820",border:"1px solid #1e2a35",borderRadius:"4px",padding:"3px 10px",fontSize:"11px",color:"#60a5fa",fontFamily:"'DM Mono',monospace"}}>{c}</span>)}
              </div>
            </div>

            {v.files.length>0&&(
              <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"20px",marginBottom:"14px"}}>
                <h3 style={{margin:"0 0 12px",fontSize:"14px",color:"#94a3b8"}}>Files ({v.files.length})</h3>
                <div style={{display:"flex",flexDirection:"column",gap:"6px"}}>
                  {v.files.map((f,i)=>(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:"10px",padding:"8px 12px",background:"#111820",borderRadius:"6px",border:"1px solid #1e2a35"}}>
                      <span style={{fontSize:"16px"}}>{{"pdf":"📄","bin":"💾","hex":"💾","jpg":"🖼️","jpeg":"🖼️","png":"🖼️","txt":"📝"}[f.extension]||"📎"}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:"12px",color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.originalName}</div>
                        <div style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace"}}>{f.jobId} · {f.timestamp?new Date(f.timestamp).toLocaleDateString():""}</div>
                      </div>
                      <button onClick={()=>fileApi.open(f.storedName)} style={{background:"#1e2a35",border:"none",borderRadius:"4px",padding:"4px 8px",color:"#60a5fa",fontSize:"10px",cursor:"pointer"}}>Open</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"20px"}}>
              <h3 style={{margin:"0 0 14px",fontSize:"14px",color:"#94a3b8"}}>Service History</h3>
              {v.jobs.map(j=>{
                const timeline=Array.isArray(j.notes)?j.notes:[];
                const payments=Array.isArray(j.payments)?j.payments:[];
                const paid=payments.reduce((s,p)=>s+(p.amount||0),0);
                return(
                  <div key={j.id} style={{borderBottom:"1px solid #111820",paddingBottom:"16px",marginBottom:"16px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
                      <div>
                        <span style={{fontSize:"13px",color:"#f97316",fontFamily:"'DM Mono',monospace",fontWeight:600}}>{j.id}</span>
                        <span style={{fontSize:"12px",color:"#475569",marginLeft:"10px"}}>{j.date?new Date(j.date).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):""}</span>
                      </div>
                      <StatusBadge status={j.status} balance={jobBal(j)}/>
                    </div>
                    <div style={{fontSize:"13px",color:"#e2e8f0",marginBottom:"4px"}}>{j.type||"Service"}{j.ecu?` — ${j.ecu}`:""}</div>
                    <div style={{fontSize:"12px",color:"#475569",fontFamily:"'DM Mono',monospace",marginBottom:"8px"}}>
                      {j.customer} · ${(j.amount||0).toLocaleString()} billed · ${paid.toLocaleString()} paid
                    </div>
                    {timeline.filter(e=>e.type==="note"&&e.text).length>0&&(
                      <div style={{borderLeft:"2px solid #1e2a35",paddingLeft:"12px",marginTop:"8px"}}>
                        {timeline.filter(e=>e.type==="note"&&e.text).map((e,i)=>(
                          <div key={i} style={{fontSize:"12px",color:"#94a3b8",marginBottom:"4px",lineHeight:1.4}}>
                            <span style={{color:"#334155",fontSize:"10px",fontFamily:"'DM Mono',monospace"}}>{e.timestamp?new Date(e.timestamp).toLocaleDateString():""}</span> {e.text}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      return(<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}}>
          <div><h1 style={{margin:0,fontSize:"22px",color:"#e2e8f0"}}>Vehicles</h1><p style={{margin:"4px 0 0",fontSize:"12px",color:"#475569"}}>{filtered.length} vehicle{filtered.length!==1?"s":""} from {jobs.length} jobs</p></div>
        </div>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search vehicle, VIN, customer..." style={{...inputStyle,maxWidth:400,marginBottom:"20px"}}/>
        {filtered.length===0&&<div style={{padding:"40px",textAlign:"center",color:"#475569",fontSize:"14px",background:"#0f1419",borderRadius:"10px",border:"1px solid #1e2a35"}}>No vehicles found — vehicles appear here automatically from work orders</div>}
        <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
          {filtered.map(v=>{
            const lastJob=v.jobs[0];
            return(
              <div key={v.key} onClick={()=>setSelected(v.key)} style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"16px 20px",cursor:"pointer",transition:"border-color 0.15s"}} onMouseOver={e=>e.currentTarget.style.borderColor="#2a3a4a"} onMouseOut={e=>e.currentTarget.style.borderColor="#1e2a35"}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"4px"}}>
                      <span style={{fontSize:"15px",color:"#e2e8f0",fontWeight:700}}>{v.vehicle}</span>
                      {lastJob&&<StatusBadge status={lastJob.status} balance={jobBal(lastJob)}/>}
                    </div>
                    <div style={{display:"flex",gap:"16px",flexWrap:"wrap",fontSize:"12px",fontFamily:"'DM Mono',monospace"}}>
                      {v.vin&&<span style={{color:"#f97316"}}>VIN: {v.vin}</span>}
                      <span style={{color:"#475569"}}>{v.jobs.length} job{v.jobs.length!==1?"s":""}</span>
                      <span style={{color:"#475569"}}>{v.customerList.join(", ")}</span>
                      {v.files.length>0&&<span style={{color:"#60a5fa"}}>{v.files.length} file{v.files.length!==1?"s":""}</span>}
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:"14px",color:"#4ade80",fontFamily:"'DM Mono',monospace",fontWeight:600}}>${v.totalPaid.toLocaleString()}</div>
                    <div style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace"}}>{v.lastDate?new Date(v.lastDate).toLocaleDateString("en-US",{month:"short",year:"numeric"}):""}</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>);
    }

    function EmailSettings(){
      const[status,setStatus]=useState(null);
      const[form,setForm]=useState({smtpHost:"",smtpPort:"587",smtpUser:"",smtpPass:"",fromName:"Good Car Solutions",fromEmail:"",testTo:""});
      const[testing,setTesting]=useState(false);
      const[saving,setSaving]=useState(false);
      const[msg,setMsg]=useState("");

      useEffect(()=>{api.server.email.configStatus().then(setStatus);},[]);

      const testEmail=async()=>{
        if(!form.smtpHost||!form.smtpUser||!form.testTo){setMsg("Fill in SMTP host, user, and test email");return;}
        setTesting(true);setMsg("");
        const r=await api.server.email.test({smtpHost:form.smtpHost,smtpPort:form.smtpPort,smtpUser:form.smtpUser,smtpPass:form.smtpPass,testTo:form.testTo});

        setSaving(false);
      };

        await api.server.email.configure({smtpHost:"",smtpPort:"587",smtpUser:"",smtpPass:"",fromName:"",fromEmail:""});

          ):(
            <div>
              <div style={{fontSize:"12px",color:"#475569",marginBottom:"12px",lineHeight:1.6}}>Configure SMTP to email invoices directly to customers. Works with Gmail (use App Password), Outlook, or any SMTP provider.</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
                <FormField label="SMTP Host"><input value={form.smtpHost} onChange={e=>setForm(f=>({...f,smtpHost:e.target.value}))} placeholder="smtp.gmail.com" style={{...inputStyle,fontSize:"12px"}}/></FormField>
                <FormField label="SMTP Port"><input value={form.smtpPort} onChange={e=>setForm(f=>({...f,smtpPort:e.target.value}))} placeholder="587" style={{...inputStyle,fontSize:"12px"}}/></FormField>
                <FormField label="SMTP Username"><input value={form.smtpUser} onChange={e=>setForm(f=>({...f,smtpUser:e.target.value}))} placeholder="you@gmail.com" style={{...inputStyle,fontSize:"12px"}}/></FormField>
                <FormField label="SMTP Password"><input type="password" value={form.smtpPass} onChange={e=>setForm(f=>({...f,smtpPass:e.target.value}))} placeholder="App password" style={{...inputStyle,fontSize:"12px"}}/></FormField>
                <FormField label="From Name"><input value={form.fromName} onChange={e=>setForm(f=>({...f,fromName:e.target.value}))} style={{...inputStyle,fontSize:"12px"}}/></FormField>
                <FormField label="From Email"><input value={form.fromEmail} onChange={e=>setForm(f=>({...f,fromEmail:e.target.value}))} placeholder="(defaults to SMTP user)" style={{...inputStyle,fontSize:"12px"}}/></FormField>
              </div>
              <div style={{marginTop:"10px"}}><FormField label="Test Email (send test to)"><input value={form.testTo} onChange={e=>setForm(f=>({...f,testTo:e.target.value}))} placeholder="your@email.com" style={{...inputStyle,fontSize:"12px"}}/></FormField></div>
              <div style={{display:"flex",gap:"8px",marginTop:"8px"}}>
                <button onClick={testEmail} disabled={testing} style={btnSecondary}>{testing?"Sending...":"Send Test"}</button>
                <button onClick={saveEmail} disabled={saving} style={btnPrimary}>{saving?"Saving...":"Save Settings"}</button>
              </div>
            </div>
          )}
          {msg&&<div style={{marginTop:"12px",fontSize:"12px",color:msg.startsWith("✓")?"#4ade80":"#f87171",fontFamily:"'DM Mono',monospace"}}>{msg}</div>}
        </div>
      );
    }

    function StripeSettings(){
      const[status,setStatus]=useState(null);
      const[apiKey,setApiKey]=useState("");
      const[testing,setTesting]=useState(false);
      const[msg,setMsg]=useState("");

      useEffect(()=>{api.server.stripe.configStatus().then(setStatus);},[]);

      const testKey=async()=>{
        if(!apiKey.startsWith("sk_")){setMsg("Key must start with sk_live_ or sk_test_");return;}
        setTesting(true);setMsg("");
        const r=await api.server.stripe.test(apiKey);
        if(r.error){setMsg("✗ "+r.error);}
        else{setMsg(`✓ Connected to "${r.businessName}" (${r.email})`);}
        setTesting(false);
      };

      const saveKey=async()=>{
        if(!apiKey.startsWith("sk_")){setMsg("Key must start with sk_live_ or sk_test_");return;}
        await api.server.stripe.configure(apiKey);
        setMsg("✓ Stripe API key saved");
        setApiKey("");
        api.server.stripe.configStatus().then(setStatus);
      };

      const removeKey=async()=>{
        if(!confirm("Remove Stripe API key?"))return;
        await api.server.stripe.configure("");
        setMsg("Stripe disconnected");
        api.server.stripe.configStatus().then(setStatus);
      };

      return(
        <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"24px",marginBottom:"14px"}}>
          <h3 style={{margin:"0 0 16px",fontSize:"15px",color:"#94a3b8"}}>Stripe Payments</h3>
          {status?.configured?(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"12px"}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:"#4ade80"}}/>
                <span style={{fontSize:"13px",color:"#4ade80",fontFamily:"'DM Mono',monospace"}}>Connected</span>
                <span style={{fontSize:"12px",color:"#475569",fontFamily:"'DM Mono',monospace"}}>({status.keyHint})</span>
              </div>
              <div style={{fontSize:"12px",color:"#475569",marginBottom:"12px"}}>Payment links will be available when generating invoices.</div>
              <button onClick={removeKey} style={{...btnSecondary,fontSize:"11px",padding:"6px 12px"}}>Disconnect Stripe</button>
            </div>
          ):(
            <div>
              <div style={{fontSize:"12px",color:"#475569",marginBottom:"12px",lineHeight:1.6}}>Connect your Stripe account to send payment links to customers when invoicing. Get your secret key from <span style={{color:"#f97316"}}>dashboard.stripe.com/apikeys</span></div>
              <FormField label="Secret Key"><input value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk_live_..." style={{...inputStyle,fontFamily:"'DM Mono',monospace",fontSize:"12px"}}/></FormField>
              <div style={{display:"flex",gap:"8px",marginTop:"4px"}}>
                <button onClick={testKey} disabled={testing||!apiKey} style={btnSecondary}>{testing?"Testing...":"Test Connection"}</button>
                <button onClick={saveKey} disabled={!apiKey} style={btnPrimary}>Save Key</button>
              </div>
            </div>
          )}
          {msg&&<div style={{marginTop:"12px",fontSize:"12px",color:msg.startsWith("✓")?"#4ade80":"#f87171",fontFamily:"'DM Mono',monospace"}}>{msg}</div>}
        </div>
      );
    }

    // ─── ESTIMATES ──────────────────────────────────────────────────
    function EstimatesView({onNavigateJob,isServer}){
      const{types:jobTypes,addType:addServiceType}=useContext(JOB_TYPES_CTX);
      const[estimates,setEstimates]=useState([]);
      const[loading,setLoading]=useState(true);
      const[showNew,setShowNew]=useState(false);
      const[filter,setFilter]=useState("Active");
      const[search,setSearch]=useState("");
      const[form,setForm]=useState({caller_name:"",phone:"",email:"",vehicle_year:"",vehicle_make:"",vehicle_model:"",vin:"",service_type:"ECU Programming",modules:"",description:"",price:"",notes:""});
      const[editId,setEditId]=useState(null);

      const load=async()=>{if(!isServer)return;try{const r=await api.server.estimates.getAll();if(r.data)setEstimates(r.data);}catch(e){}setLoading(false);};
      useEffect(()=>{load();},[]);

      const saveEstimate=async()=>{
        if(!form.caller_name&&!form.phone)return;
        const d={...form,price:Number(form.price)||0};
        if(editId){await api.server.estimates.update(editId,d);setEditId(null);}
        else{await api.server.estimates.create(d);}
        setForm({caller_name:"",phone:"",email:"",vehicle_year:"",vehicle_make:"",vehicle_model:"",vin:"",service_type:"ECU Programming",modules:"",description:"",price:"",notes:""});
        setShowNew(false);load();
      };

      const convertToJob=async(est)=>{
        if(!confirm(`Convert ${est.id} to a work order?`))return;
        const r=await api.server.estimates.convert(est.id);
        if(r.data){load();if(onNavigateJob)onNavigateJob(r.data.jobId);}
      };

      const deleteEst=async(id)=>{if(!confirm("Delete this estimate?"))return;await api.server.estimates.delete(id);load();};

      const startEdit=(est)=>{
        setForm({caller_name:est.caller_name||"",phone:est.phone||"",email:est.email||"",vehicle_year:est.vehicle_year||"",vehicle_make:est.vehicle_make||"",vehicle_model:est.vehicle_model||"",vin:est.vin||"",service_type:est.service_type||"ECU Programming",modules:est.modules||"",description:est.description||"",price:est.price||"",notes:est.notes||""});

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
            <h1 style={{margin:0,fontSize:"22px",color:"#e2e8f0"}}>Estimates</h1>
            <button onClick={()=>{setEditId(null);setForm({caller_name:"",phone:"",email:"",vehicle_year:"",vehicle_make:"",vehicle_model:"",vin:"",service_type:"ECU Programming",modules:"",description:"",price:"",notes:""});setShowNew(true);}} style={btnPrimary}>+ New Estimate</button>
          </div>

          {showNew&&(
            <div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"20px",marginBottom:"20px"}}>
              <div style={{fontSize:"14px",color:"#e2e8f0",fontWeight:600,marginBottom:"14px"}}>{editId?"Edit Estimate":"Quick Intake — Phone Call"}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px"}}>
                <FormField label="Caller Name *"><input value={form.caller_name} onChange={e=>setForm(f=>({...f,caller_name:e.target.value}))} placeholder="Name" style={inputStyle}/></FormField>
                <FormField label="Phone"><input value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))} placeholder="(xxx) xxx-xxxx" style={inputStyle}/></FormField>
                <FormField label="Email"><input value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="email@..." style={inputStyle}/></FormField>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"80px 1fr 1fr 1fr",gap:"10px",marginTop:"10px"}}>
                <FormField label="Year"><input value={form.vehicle_year} onChange={e=>setForm(f=>({...f,vehicle_year:e.target.value}))} placeholder="2024" style={inputStyle}/></FormField>

    // ─── NAV ─────────────────────────────────────────────────────────
    // ─── CALENDAR / MAP HOME PAGE ────────────────────────────────────
    function CalendarMapView({jobs,customers,isServer,onUpdateJob,onSelectJob}){
      const[selectedDate,setSelectedDate]=useState(new Date().toISOString().split("T")[0]);
      const[viewMonth,setViewMonth]=useState(new Date());
      const[showScheduler,setShowScheduler]=useState(false);
      const[schedJob,setSchedJob]=useState(null);
      const[schedTime,setSchedTime]=useState({start:"09:00",end:"10:00"});
      const mapRef=useRef(null);const mapInst=useRef(null);const markersRef=useRef([]);const routeRef=useRef(null);

      // Init map
      useEffect(()=>{
        if(!mapRef.current||mapInst.current)return;
        mapInst.current=L.map(mapRef.current,{zoomControl:true}).setView([29.76,-95.37],11);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OSM",maxZoom:18}).addTo(mapInst.current);
        return()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
      },[]);

      // Jobs for selected date
      const dayJobs=jobs.filter(j=>j.date===selectedDate).sort((a,b)=>(a.scheduledStart||"99:99").localeCompare(b.scheduledStart||"99:99"));
      const unscheduledJobs=jobs.filter(j=>(!j.date||j.date==="")&&j.status!=="Completed"&&j.status!=="Cancelled");

      // Update map markers for selected date
      useEffect(()=>{
        if(!mapInst.current)return;
        markersRef.current.forEach(m=>mapInst.current.removeLayer(m));markersRef.current=[];
        if(routeRef.current){mapInst.current.removeLayer(routeRef.current);routeRef.current=null;}
        const withAddr=dayJobs.filter(j=>j.serviceAddress);
        const geocode=async()=>{
          const coords=[];
          for(const j of withAddr){
            try{
              const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(j.serviceAddress)}&format=json&limit=1`);
              const d=await r.json();
              if(d&&d[0]){
                const lat=parseFloat(d[0].lat),lng=parseFloat(d[0].lon);
                coords.push([lat,lng]);
                const timeLabel=j.scheduledStart?`<b>${j.scheduledStart}${j.scheduledEnd?" - "+j.scheduledEnd:""}</b><br/>`:"";
                const mk=L.marker([lat,lng]).addTo(mapInst.current)
                  .bindPopup(`${timeLabel}<b>${j.id}</b>: ${j.vehicle}<br/>${j.customer}<br/>📍 ${j.serviceAddress}`);
                markersRef.current.push(mk);
              }
            }catch(e){}
          }
          if(coords.length>1){
            try{
              const coordStr=coords.map(c=>c[1]+","+c[0]).join(";");
              const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`);
              const d=await r.json();
              if(d.routes&&d.routes[0]){
                routeRef.current=L.geoJSON(d.routes[0].geometry,{style:{color:"#f97316",weight:3,opacity:0.7}}).addTo(mapInst.current);
                const mins=Math.round(d.routes[0].duration/60);
                const miles=(d.routes[0].distance*0.000621371).toFixed(1);
                routeRef.current.bindPopup(`Route: ${miles} mi · ${mins} min`);
              }
            }catch(e){}
          }
          if(markersRef.current.length>0){
            const group=L.featureGroup(markersRef.current);
            mapInst.current.fitBounds(group.getBounds().pad(0.3));
          }
        };

    function LoginScreen({onConnect,onLocal}){
      const[serverUrl,setServerUrl]=useState("http://192.168.1.100:3377");

      const[password,setPassword]=useState("");

      useEffect(()=>{api.server.loadConfig().then(cfg=>{if(cfg.serverUrl)setServerUrl(cfg.serverUrl);});},[]);

      const testConnection=async()=>{
        setChecking(true);setStatus("");
        try{const r=await api.server.healthCheck(serverUrl);if(r.error){setStatus("✗ "+r.error);}else{setStatus("✓ Server online — "+r.server+" v"+r.version);}}catch(e){setStatus("✗ "+e.message);}
        setChecking(false);
      };

      const doLogin=async()=>{
        if(!username||!password){setStatus("Enter username and password");return;}
        setChecking(true);setStatus("");
        try{
          const r=await api.server.login(serverUrl,username,password);
          if(r.success){await api.server.saveConfig({serverUrl,autoConnect:true});localStorage.setItem("gcs_server_url",serverUrl);localStorage.setItem("gcs_server_token",r.token);onConnect(r.user,r.token);}

      return(

              <div style={{fontSize:"11px",color:"#475569",textTransform:"uppercase",letterSpacing:"2px",fontFamily:"'DM Mono',monospace",marginTop:"4px"}}>Good Car Solutions</div>

              <button onClick={testConnection} disabled={checking} style={{...btnSecondary,width:"100%",marginBottom:"16px"}}>{checking?"Testing...":"Test Connection"}</button>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}}>
                <FormField label="Username"><input value={username} onChange={e=>setUsername(e.target.value)} placeholder="admin" style={inputStyle} onKeyDown={e=>{if(e.key==="Enter")doLogin();}}/></FormField>
                <FormField label="Password"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••" style={inputStyle} onKeyDown={e=>{if(e.key==="Enter")doLogin();}}/></FormField>
              </div>
              <button onClick={doLogin} disabled={checking} style={{...btnPrimary,width:"100%",marginTop:"4px"}}>{checking?"Connecting...":"Login & Connect"}</button>
              {status&&<div style={{marginTop:"12px",fontSize:"12px",color:status.startsWith("✓")?"#4ade80":"#f87171",fontFamily:"'DM Mono',monospace"}}>{status}</div>}
            </div>
            <div style={{textAlign:"center"}}><button onClick={onLocal} style={{background:"none",border:"none",color:"#475569",fontSize:"12px",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>Continue in Local Mode →</button></div>
          </div>
        </div>
      );

      const addUser=async()=>{
        if(!form.username||!form.password){setMsg("Username and password required");return;}

      const resetPassword=async(u)=>{const pw=prompt(`New password for ${u.username}:`);if(pw){await api.server.users.update(u.id,{password:pw});setMsg(`Password reset for ${u.username}`);}};

        if(r.error){setMsg(r.error);}else{setEditing(null);load();}

        }

      const[jobTypes,setJobTypes]=useState([...DEFAULT_JOB_TYPES]);

      const isServer=mode==="server";
      const isAdmin=!isServer||serverUser?.role==="admin";

      const NAV=[...NAV_BASE];
      if(isServer&&isAdmin)NAV.splice(6,0,{id:"users",label:"Membership",icon:"🔑"});

      // Smart data layer
      const dataApi=useMemo(()=>{
        if(!isServer)return{
          loadAll:async()=>{const[j,c,k,v]=await Promise.all([api.jobs.getAll(),api.customers.getAll(),api.kb.getAll(),api.vehicles.getAll()]);return{jobs:j||[],customers:c||[],kb:k||{procedures:[],dtcMaps:[],fileLibrary:[]},vehicles:v||[]};},
          createJob:d=>api.jobs.create(d),updateJob:(id,u)=>api.jobs.update(id,u),deleteJob:id=>api.jobs.delete(id),
          createCustomer:d=>api.customers.create(d),updateCustomer:(id,u)=>api.customers.update(id,u),deleteCustomer:id=>api.customers.delete(id),
          addKBEntry:(cat,e)=>api.kb.addEntry(cat,e),deleteKBEntry:(cat,id)=>api.kb.deleteEntry(cat,id),
          addVehicle:d=>api.vehicles.create(d),deleteVehicle:id=>api.vehicles.delete(id),
        };
        const unwrap=async(fn)=>{const r=await fn();if(r.error)throw new Error(r.error);return r.data;};
        return{
          loadAll:async()=>{const[j,c,k,v]=await Promise.all([unwrap(()=>api.server.jobs.getAll()),unwrap(()=>api.server.customers.getAll()),unwrap(()=>api.server.kb.getAll()),unwrap(()=>api.server.vehicles.getAll())]);return{jobs:j||[],customers:c||[],kb:k||{procedures:[],dtcMaps:[],fileLibrary:[]},vehicles:v||[]};},
          createJob:d=>unwrap(()=>api.server.jobs.create(d)),updateJob:(id,u)=>unwrap(()=>api.server.jobs.update(id,u)),deleteJob:id=>unwrap(()=>api.server.jobs.delete(id)),
          createCustomer:d=>unwrap(()=>api.server.customers.create(d)),updateCustomer:(id,u)=>unwrap(()=>api.server.customers.update(id,u)),deleteCustomer:id=>unwrap(()=>api.server.customers.delete(id)),
          addKBEntry:(cat,e)=>unwrap(()=>api.server.kb.addEntry(cat,e)),deleteKBEntry:(cat,id)=>unwrap(()=>api.server.kb.deleteEntry(cat,id)),
          addVehicle:d=>unwrap(()=>api.server.vehicles.create(d)),deleteVehicle:id=>unwrap(()=>api.server.vehicles.delete(id)),
        };
      },[isServer]);

      const loadData=async()=>{try{setSyncError("");const d=await dataApi.loadAll();setJobs(d.jobs);setCustomers(d.customers);setKb(d.kb);setVehicles(d.vehicles);}catch(e){console.error(e);setSyncError(e.message);}setLoading(false);};
      useEffect(()=>{if(mode)loadData();},[mode]);

      useEffect(()=>{if(!mode)return;if(isServer){api.server.request("GET","/api/service-types").then(r=>{if(r.types)setJobTypes(r.types);}).catch(()=>{});}else{api.settings.get().then(s=>{if(s?.customServiceTypes){try{const custom=JSON.parse(s.customServiceTypes);const merged=[...DEFAULT_JOB_TYPES];for(const t of custom){if(!merged.includes(t))merged.splice(merged.length-1,0,t);}setJobTypes(merged);}catch(e){}}});}
      },[mode,isServer]);
      const addServiceType=async(type)=>{if(!type||jobTypes.includes(type))return;const updated=[...jobTypes];updated.splice(updated.length-1,0,type);setJobTypes(updated);if(isServer){api.server.request("POST","/api/service-types",{type}).catch(()=>{});}else{const s=await api.settings.get();const custom=s?.customServiceTypes?JSON.parse(s.customServiceTypes):[];if(!custom.includes(type)){custom.push(type);api.settings.update({customServiceTypes:JSON.stringify(custom)});}}
      };

      // Auto-refresh in server mode (15s)
      useEffect(()=>{if(!isServer)return;const iv=setInterval(async()=>{try{const d=await dataApi.loadAll();setJobs(d.jobs);setCustomers(d.customers);setKb(d.kb);setVehicles(d.vehicles);setSyncError("");}catch(e){setSyncError("Sync lost: "+e.message);}},15000);return()=>clearInterval(iv);},[isServer,dataApi]);

      // CRUD
      const createJob=async d=>{const n=await dataApi.createJob(d);if(isServer){await loadData();}else{setJobs(p=>[n,...p]);}return n;};
      const updateJob=async(id,u)=>{const up=await dataApi.updateJob(id,u);if(isServer){const d=await dataApi.loadAll();setJobs(d.jobs);setCustomers(d.customers);setKb(d.kb);setVehicles(d.vehicles);const fresh=d.jobs.find(j=>j.id===id);if(fresh&&selectedJob?.id===id)setSelectedJob(fresh);}else{setJobs(p=>p.map(j=>j.id===id?up:j));if(selectedJob?.id===id)setSelectedJob(up);}};
      const deleteJob=async id=>{if(!isAdmin){alert("Only admins can delete work orders");return;}await dataApi.deleteJob(id);if(isServer){loadData();}else{setJobs(p=>p.filter(j=>j.id!==id));}};
      const createCustomer=async d=>{const n=await dataApi.createCustomer(d);if(isServer){loadData();}else{setCustomers(p=>[...p,n]);}return n;};
      const updateCustomer=async(id,u)=>{const up=await dataApi.updateCustomer(id,u);if(isServer){loadData();}else{setCustomers(p=>p.map(c=>c.id===id?{...c,...u}:c));}};
      const deleteCustomer=async id=>{if(!isAdmin){alert("Only admins can delete customers");return;}await dataApi.deleteCustomer(id);if(isServer){loadData();}else{setCustomers(p=>p.filter(c=>c.id!==id));}};
      const addKBEntry=async(cat,e)=>{const n=await dataApi.addKBEntry(cat,e);if(isServer){loadData();}else{setKb(p=>({...p,[cat]:[...(p[cat]||[]),n]}));}};
      const deleteKBEntry=async(cat,id)=>{if(!isAdmin)return;await dataApi.deleteKBEntry(cat,id);if(isServer){loadData();}else{setKb(p=>({...p,[cat]:(p[cat]||[]).filter(e=>e.id!==id)}));}};
      const addVehicle=async d=>{const n=await dataApi.addVehicle(d);if(isServer){loadData();}else{setVehicles(p=>[...p,n]);}};
      const deleteVehicle=async id=>{if(!isAdmin)return;await dataApi.deleteVehicle(id);if(isServer){loadData();}else{setVehicles(p=>p.filter(v=>v.id!==id));}};

      const disconnect=async()=>{await api.server.logout();setMode(null);setServerUser(null);setLoading(true);};

      if(!mode)return <LoginScreen onConnect={(user)=>{setServerUser(user);setMode("server");}} onLocal={()=>setMode("local")}/>;
      if(loading)return<div className="loading">Loading...</div>;

      const versionTag=isServer?`v2.6.4 · ${serverUser?.displayName} (${serverUser?.role})`:"v2.6.4 · Local";

      return(
        <JOB_TYPES_CTX.Provider value={{types:jobTypes,addType:addServiceType}}>
        <div style={{display:"flex",height:"100%"}}>
          <div style={{width:210,background:"#0a0e13",borderRight:"1px solid #1e2a35",padding:"16px 12px",flexShrink:0,display:"flex",flexDirection:"column"}}>
            <div style={{padding:"4px 10px",marginBottom:"28px",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:"16px",fontWeight:700,color:"#f97316",letterSpacing:"-0.5px"}}>GCS</div><div style={{fontSize:"10px",color:"#475569",textTransform:"uppercase",letterSpacing:"1.5px",fontFamily:"'DM Mono',monospace",marginTop:"2px"}}>Good Car Solutions</div></div>{isServer&&<NotificationBell isServer={isServer}/>}</div>
            <nav style={{display:"flex",flexDirection:"column",gap:"2px",flex:1}}>
              {NAV.map(n=><button key={n.id} onClick={()=>setView(n.id)} style={{display:"flex",alignItems:"center",gap:"10px",padding:"10px 12px",background:view===n.id?"#111820":"transparent",border:"none",borderRadius:"8px",color:view===n.id?"#e2e8f0":"#475569",cursor:"pointer",fontSize:"13px",fontWeight:view===n.id?600:400,textAlign:"left",width:"100%",borderLeft:view===n.id?"2px solid #f97316":"2px solid transparent"}}><span style={{fontSize:"14px",opacity:view===n.id?1:0.5}}>{n.icon}</span>{n.label}</button>)}
            </nav>
            {isServer&&(<div style={{padding:"0 10px",marginBottom:"8px"}}><div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"4px"}}><span style={{width:6,height:6,borderRadius:"50%",background:syncError?"#f87171":"#4ade80"}}/><span style={{fontSize:"10px",color:syncError?"#f87171":"#4ade80",fontFamily:"'DM Mono',monospace"}}>{syncError?"Disconnected":"Synced"}</span></div><button onClick={disconnect} style={{background:"none",border:"none",color:"#475569",fontSize:"10px",cursor:"pointer",fontFamily:"'DM Mono',monospace",padding:0}}>Disconnect</button></div>)}
            <div style={{borderTop:"1px solid #1e2a35",paddingTop:"14px"}}><div style={{fontSize:"10px",color:"#1e2a35",fontFamily:"'DM Mono',monospace",padding:"0 10px"}}>{versionTag}</div></div>
          </div>
          <div style={{flex:1,padding:"24px",overflow:"auto"}}>
            {syncError&&<div style={{background:"#3a1a1a",border:"1px solid #5a2020",borderRadius:"8px",padding:"10px 14px",marginBottom:"16px",fontSize:"12px",color:"#f87171",fontFamily:"'DM Mono',monospace"}}>{syncError} <button onClick={loadData} style={{background:"none",border:"none",color:"#f97316",cursor:"pointer",fontSize:"12px",fontFamily:"'DM Mono',monospace",marginLeft:"8px"}}>Retry</button></div>}
            {view==="calendar"&&<CalendarMapView jobs={jobs} customers={customers} isServer={isServer} onUpdateJob={updateJob} onSelectJob={setSelectedJob}/>}
            {view==="dashboard"&&<Dashboard jobs={jobs} customers={customers} onNavigate={setView}/>}
            {view==="jobs"&&<JobsView jobs={jobs} customers={customers} onSelectJob={setSelectedJob} onNewJob={()=>setShowNewJob(true)} onUpdateJob={updateJob}/>}
            {view==="estimates"&&<EstimatesView onNavigateJob={(id)=>{const j=jobs.find(x=>x.id===id);if(j)setSelectedJob(j);else{loadData().then(()=>setView("jobs"));}}} isServer={isServer}/>}
            {view==="teams"&&<TeamsView jobs={jobs} isServer={isServer}/>}
            {view==="customers"&&<CustomersView customers={customers} jobs={jobs} onNewCustomer={()=>setShowNewCust(true)} onUpdateCustomer={updateCustomer} onDeleteCustomer={deleteCustomer} onSelectJob={setSelectedJob}/>}
            {view==="intake"&&<IntakeView isServer={isServer}/>}
            {view==="compliance"&&<ComplianceView jobs={jobs} customers={customers} isServer={isServer}/>}
            {view==="knowledge"&&<KnowledgeBase knowledgeBase={kb} onAddEntry={addKBEntry} onDeleteEntry={deleteKBEntry}/>}
            {view==="vehicles"&&<VehicleDatabase vehicles={vehicles} jobs={jobs} customers={customers} onAddVehicle={addVehicle} onDeleteVehicle={deleteVehicle} isServer={isServer}/>}
            {view==="users"&&isAdmin&&isServer&&<UserManagement/>}
            {view==="settings"&&<SettingsView isServer={isServer}/>}
          </div>
          {selectedJob&&<JobDetailPanel job={selectedJob} customers={customers} onClose={()=>setSelectedJob(null)} onUpdate={updateJob} onDelete={deleteJob} onCreateCustomer={createCustomer} isServer={isServer}/>}
          {showNewJob&&<NewJobModal customers={customers} onClose={()=>setShowNewJob(false)} onSave={async(d)=>{const n=await createJob(d);if(n){setShowNewJob(false);setView("jobs");setSelectedJob(n);}}} onCreateCustomer={createCustomer}/>}
          {showNewCust&&<NewCustomerModal onClose={()=>setShowNewCust(false)} onSave={createCustomer}/>}
        </div>
        </JOB_TYPES_CTX.Provider>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
