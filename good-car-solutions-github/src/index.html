<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Car Solutions v2.6.4</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Space Grotesk',-apple-system,sans-serif;background:#070a0e;color:#e2e8f0;overflow:hidden}
    ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1e2a35;border-radius:3px}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .loading{animation:pulse 1.5s infinite;color:#475569;font-size:14px;padding:40px;text-align:center}
    input,select,textarea,button{font-family:inherit}input::placeholder,textarea::placeholder{color:#334155}
    .titlebar{-webkit-app-region:drag;height:32px;background:#0a0e13;border-bottom:1px solid #111820;display:flex;align-items:center;padding:0 12px;position:fixed;top:0;left:0;right:0;z-index:9999}
    .titlebar span{font-size:11px;color:#334155;font-family:'DM Mono',monospace;-webkit-app-region:no-drag}
    .leaflet-container{background:#0a0e13!important;border-radius:10px}
    .leaflet-tile-pane{filter:brightness(0.7) contrast(1.1) saturate(0.3) hue-rotate(180deg) invert(1)}
    .leaflet-control-zoom a{background:#0f1419!important;color:#94a3b8!important;border-color:#1e2a35!important}
  </style>
</head>
<body>
  <div class="titlebar"><span>Good Car Solutions v2.6.4</span></div>
  <div id="root" style="margin-top:32px;height:calc(100vh - 32px)"></div>

  <script type="text/babel">
    const{useState,useEffect,useCallback,useRef,useMemo}=React;
    const api=window.gcs;

    // ─── CONFIG ──────────────────────────────────────────────────────
    const STATUS_COLORS={"In Route":{bg:"#1a2a3a",text:"#38bdf8",dot:"#0ea5e9"},"In Progress":{bg:"#1a3a2a",text:"#4ade80",dot:"#22c55e"},Scheduled:{bg:"#1a2a3a",text:"#60a5fa",dot:"#3b82f6"},Completed:{bg:"#1a2a1a",text:"#86efac",dot:"#4ade80"},"Pending Parts":{bg:"#3a2a1a",text:"#fbbf24",dot:"#f59e0b"},Cancelled:{bg:"#3a1a1a",text:"#f87171",dot:"#ef4444"}};

    function fireConfetti(color){
      const canvas=document.createElement("canvas");
      canvas.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999";
      document.body.appendChild(canvas);
      const ctx=canvas.getContext("2d");
      canvas.width=window.innerWidth;canvas.height=window.innerHeight;
      const colors=[color||"#f97316","#4ade80","#60a5fa","#fbbf24","#f87171","#a78bfa"];
      const pieces=[];
      for(let i=0;i<80;i++){
        pieces.push({x:canvas.width/2+(Math.random()-0.5)*200,y:canvas.height/2,vx:(Math.random()-0.5)*12,vy:-(Math.random()*12+4),size:Math.random()*8+4,color:colors[Math.floor(Math.random()*colors.length)],rotation:Math.random()*360,rotSpeed:(Math.random()-0.5)*10,gravity:0.25,life:1});
      }
      let frame=0;
      const animate=()=>{
        ctx.clearRect(0,0,canvas.width,canvas.height);
        let alive=false;
        for(const p of pieces){
          p.vy+=p.gravity;p.x+=p.vx;p.y+=p.vy;p.rotation+=p.rotSpeed;p.life-=0.008;p.vx*=0.99;
          if(p.life<=0)continue;
          alive=true;
          ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation*Math.PI/180);
          ctx.fillStyle=p.color;ctx.globalAlpha=p.life;
          ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
          ctx.restore();
        }
        frame++;
        if(alive&&frame<180)requestAnimationFrame(animate);
        else{canvas.remove();}
      };
      requestAnimationFrame(animate);
    }
    const PRIORITY_COLORS={High:"#ef4444",Medium:"#f59e0b",Low:"#6b7280"};
    const DEFAULT_JOB_TYPES=["ECU Programming","Module Cloning","ECU Adaptation","GPEC2 Unlock","ADAS Calibration","Electrical Diagnostics","Key Programming","BCM Programming","TCM Programming","Other"];
    let _jobTypes=[...DEFAULT_JOB_TYPES];
    const JOB_TYPES_CTX=React.createContext({types:_jobTypes,addType:()=>{}});
    const CUSTOMER_TYPES=["Independent Shop","Body Shop","Dealer","Fleet Operator","Individual","Other"];
    const FILE_ICONS={pdf:"📄",bin:"💾",hex:"💾",ori:"📦",mod:"🔧",jpg:"🖼️",jpeg:"🖼️",png:"🖼️",txt:"📝",csv:"📊",doc:"📄",docx:"📄",xls:"📊",xlsx:"📊"};

    const inputStyle={width:"100%",background:"#0a0e13",border:"1px solid #1e2a35",borderRadius:"8px",padding:"10px 12px",color:"#e2e8f0",fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"'DM Mono',monospace"};
    const btnPrimary={background:"#f97316",border:"none",borderRadius:"8px",padding:"10px 20px",color:"#0a0e13",fontSize:"13px",cursor:"pointer",fontWeight:700,letterSpacing:"0.3px"};
    const btnSecondary={background:"#1e2a35",border:"none",borderRadius:"8px",padding:"10px 20px",color:"#94a3b8",fontSize:"13px",cursor:"pointer",fontWeight:600};
    const btnDanger={background:"#3a1a1a",border:"1px solid #5a2020",borderRadius:"8px",padding:"10px 20px",color:"#f87171",fontSize:"13px",cursor:"pointer",fontWeight:600};

    // ─── SHARED COMPONENTS ───────────────────────────────────────────
    function StatusBadge({status,balance}){const isPendingPay=status==="Completed"&&balance>0;const label=isPendingPay?"Pending Payment":status;const c=isPendingPay?{bg:"#3a1a1a",text:"#f87171",dot:"#ef4444"}:(STATUS_COLORS[status]||STATUS_COLORS.Scheduled);return(<span style={{background:c.bg,color:c.text,padding:"4px 10px",borderRadius:"6px",fontSize:"11px",fontWeight:600,letterSpacing:"0.5px",textTransform:"uppercase",display:"inline-flex",alignItems:"center",gap:"6px",whiteSpace:"nowrap"}}><span style={{width:6,height:6,borderRadius:"50%",background:c.dot,display:"inline-block"}}/>{label}</span>);}
    function jobBal(j){const pmt=Array.isArray(j.payments)?j.payments.reduce((a,p)=>a+(p.amount||0),0):0;return(j.amount||0)-pmt;}
    function PriorityDot({priority}){return(<span style={{display:"inline-flex",alignItems:"center",gap:"5px",fontSize:"12px",color:"#94a3b8"}}><span style={{width:8,height:8,borderRadius:"50%",background:PRIORITY_COLORS[priority]||"#6b7280"}}/>{priority}</span>);}
    function MetricCard({label,value,sub,accent}){return(<div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"10px",padding:"20px 22px",flex:1,minWidth:170}}><div style={{fontSize:"11px",color:"#64748b",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"8px",fontFamily:"'DM Mono',monospace"}}>{label}</div><div style={{fontSize:"26px",fontWeight:700,color:accent||"#e2e8f0",lineHeight:1.1}}>{value}</div>{sub&&<div style={{fontSize:"12px",color:"#475569",marginTop:"6px"}}>{sub}</div>}</div>);}
    function FormField({label,children}){return(<div style={{marginBottom:"14px"}}><label style={{display:"block",fontSize:"11px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.8px",marginBottom:"6px",fontFamily:"'DM Mono',monospace"}}>{label}</label>{children}</div>);}
    function Modal({onClose,title,width,children}){return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,backdropFilter:"blur(4px)",padding:"20px",animation:"fadeIn 0.15s ease"}} onClick={onClose}><div style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"14px",width:"100%",maxWidth:width||560,maxHeight:"85vh",overflow:"auto",padding:"28px"}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"24px"}}><h2 style={{margin:0,fontSize:"18px",color:"#e2e8f0"}}>{title}</h2><button onClick={onClose} style={{background:"none",border:"none",color:"#64748b",fontSize:"20px",cursor:"pointer"}}>✕</button></div>{children}</div></div>);}

    function ServiceTypeSelect({value,onChange,types,onAddType}){
      const[showCustom,setShowCustom]=useState(false);const[customVal,setCustomVal]=useState("");
      const handleChange=e=>{if(e.target.value==="__add_custom__"){setShowCustom(true);setCustomVal("");}else{onChange(e.target.value);}};
      const saveCustom=()=>{const v=customVal.trim();if(v){if(onAddType)onAddType(v);onChange(v);}setShowCustom(false);setCustomVal("");};
      if(showCustom)return(<div style={{display:"flex",gap:"6px"}}><input value={customVal} onChange={e=>setCustomVal(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveCustom();if(e.key==="Escape"){setShowCustom(false);setCustomVal("");}}} placeholder="Enter service type..." style={{...inputStyle,flex:1}} autoFocus/><button onClick={saveCustom} style={{...btnPrimary,padding:"10px 14px",fontSize:"12px"}}>Add</button><button onClick={()=>{setShowCustom(false);setCustomVal("");}} style={{...btnSecondary,padding:"10px 10px",fontSize:"12px"}}>✕</button></div>);
      return(<select value={value} onChange={handleChange} style={inputStyle}>{(types||DEFAULT_JOB_TYPES).map(t=><option key={t} value={t}>{t}</option>)}<option value="__add_custom__">+ Add Custom Type...</option></select>);
    }

    function AddressLink({address}){
      if(!address)return null;
      const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}`;
      const open=(e)=>{e.preventDefault();e.stopPropagation();if(window.gcs?.openExternal){window.gcs.openExternal(url);}else{window.open(url,"_blank");}};
      return(<a href={url} onClick={open} style={{color:"#f97316",textDecoration:"none",fontSize:"inherit",cursor:"pointer"}}>{address} <span style={{fontSize:"10px"}}>↗</span></a>);
    }

    function formatBytes(b){if(!b)return"0 B";const k=1024;const s=["B","KB","MB","GB"];const i=Math.floor(Math.log(b)/Math.log(k));return parseFloat((b/Math.pow(k,i)).toFixed(1))+" "+s[i];}
    function formatNoteTime(iso){if(!iso)return"";const d=new Date(iso);const now=new Date();const dm=Math.floor((now-d)/60000);const dh=Math.floor((now-d)/3600000);const dd=Math.floor((now-d)/86400000);let rel="";if(dm<1)rel="just now";else if(dm<60)rel=dm+"m ago";else if(dh<24)rel=dh+"h ago";else if(dd<7)rel=dd+"d ago";const ds=d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});const ts=d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});return rel?`${ds} ${ts} (${rel})`:`${ds} ${ts}`;}

    // ─── NEW JOB MODAL ───────────────────────────────────────────────
    function NewJobModal({onClose,onSave,customers,onCreateCustomer}){
      const{types:jobTypes,addType:addServiceType}=useContext(JOB_TYPES_CTX);
      const[form,setForm]=useState({vehicle:"",vin:"",customerId:"",type:"ECU Programming",ecu:"",priority:"Medium",tools:"",notes:"",amount:"",date:new Date().toISOString().split("T")[0],status:"Scheduled",serviceAddress:""});
      const[showInlineCust,setShowInlineCust]=useState(false);
      const set=(k,v)=>setForm(f=>({...f,[k]:v}));
      const selCust=customers.find(c=>c.id===form.customerId);
      const handleInlineSave=async(data)=>{const nc=await onCreateCustomer(data);if(nc){setForm(f=>({...f,customerId:nc.id,serviceAddress:f.serviceAddress||nc.address||""}));}setShowInlineCust(false);};
      return(
        <Modal onClose={onClose} title="New Work Order">
          <FormField label="Vehicle"><input value={form.vehicle} onChange={e=>set("vehicle",e.target.value)} placeholder="2019 Mercedes Sprinter 3500" style={inputStyle}/></FormField>
          <FormField label="VIN"><input value={form.vin} onChange={e=>set("vin",e.target.value)} placeholder="WD4PE8CD7K..." style={inputStyle}/></FormField>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
            <FormField label="Customer">
              <select value={form.customerId} onChange={e=>set("customerId",e.target.value)} style={inputStyle}>
                <option value="">Select...</option>
                {customers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <button onClick={()=>setShowInlineCust(!showInlineCust)} style={{background:"none",border:"none",color:"#f97316",fontSize:"11px",cursor:"pointer",marginTop:"6px",fontFamily:"'DM Mono',monospace"}}>+ Add New Customer</button>
              {showInlineCust&&<InlineNewCustomer onSave={handleInlineSave} onCancel={()=>setShowInlineCust(false)}/>}
            </FormField>
            <FormField label="Job Type"><ServiceTypeSelect value={form.type} onChange={v=>set("type",v)} types={jobTypes} onAddType={addServiceType}/></FormField>
          </div>
          <FormField label="Service Address">
            <input value={form.serviceAddress||(selCust?.address||"")} onChange={e=>set("serviceAddress",e.target.value)} placeholder="Shop address for this job" style={inputStyle}/>
          </FormField>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
            <FormField label="ECU / Module"><input value={form.ecu} onChange={e=>set("ecu",e.target.value)} placeholder="EDC17C43" style={inputStyle}/></FormField>
            <FormField label="Priority"><select value={form.priority} onChange={e=>set("priority",e.target.value)} style={inputStyle}><option>High</option><option>Medium</option><option>Low</option></select></FormField>
          </div>
          <FormField label="Tools"><input value={form.tools} onChange={e=>set("tools",e.target.value)} placeholder="KESS3, VVDI Prog, wiTECH..." style={inputStyle}/></FormField>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
            <FormField label="Amount ($)"><input type="number" value={form.amount} onChange={e=>set("amount",e.target.value)} placeholder="0.00" style={inputStyle}/></FormField>
            <FormField label="Date"><input type="date" value={form.date} onChange={e=>set("date",e.target.value)} style={inputStyle}/></FormField>
          </div>
          <FormField label="Initial Note"><textarea value={form.notes} onChange={e=>set("notes",e.target.value)} rows={2} placeholder="First note for this job..." style={{...inputStyle,resize:"vertical"}}/></FormField>
          <div style={{display:"flex",gap:"10px",justifyContent:"flex-end",marginTop:"6px"}}>
            <button onClick={onClose} style={btnSecondary}>Cancel</button>
            <button onClick={()=>{const timeline=[];if(form.notes.trim())timeline.push({type:"note",text:form.notes.trim(),timestamp:new Date().toISOString()});onSave({...form,customer:selCust?.name||"",notes:timeline,amount:Number(form.amount)||0,paid:false,payments:[],serviceAddress:form.serviceAddress||(selCust?.address||"")});onClose();}} style={btnPrimary}>Create Work Order</button>
          </div>
        </Modal>
      );
    }

    // ─── NEW CUSTOMER MODAL ──────────────────────────────────────────
    function NewCustomerModal({onClose,onSave}){
      const[form,setForm]=useState({name:"",contact:"",phone:"",email:"",type:"Independent Shop",address:"",notes:""});
      const set=(k,v)=>setForm(f=>({...f,[k]:v}));
      return(
        <Modal onClose={onClose} title="New Customer">
          <FormField label="Business Name"><input value={form.name} onChange={e=>set("name",e.target.value)} placeholder="Heights Auto Repair" style={inputStyle}/></FormField>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
            <FormField label="Contact Person"><input value={form.contact} onChange={e=>set("contact",e.target.value)} placeholder="Mike Tran" style={inputStyle}/></FormField>
            <FormField label="Type"><select value={form.type} onChange={e=>set("type",e.target.value)} style={inputStyle}>{CUSTOMER_TYPES.map(t=><option key={t}>{t}</option>)}</select></FormField>
          </div>
          <FormField label="Address"><input value={form.address} onChange={e=>set("address",e.target.value)} placeholder="1234 Main St, Houston, TX 77001" style={inputStyle}/></FormField>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
            <FormField label="Phone"><input value={form.phone} onChange={e=>set("phone",e.target.value)} placeholder="(713) 555-0142" style={inputStyle}/></FormField>
            <FormField label="Email"><input value={form.email} onChange={e=>set("email",e.target.value)} placeholder="mike@heightsauto.com" style={inputStyle}/></FormField>
          </div>
          <FormField label="Notes"><textarea value={form.notes} onChange={e=>set("notes",e.target.value)} rows={2} placeholder="Account notes, payment terms..." style={{...inputStyle,resize:"vertical"}}/></FormField>
          <div style={{display:"flex",gap:"10px",justifyContent:"flex-end",marginTop:"6px"}}>
            <button onClick={onClose} style={btnSecondary}>Cancel</button>
            <button onClick={()=>{onSave(form);onClose();}} style={btnPrimary}>Add Customer</button>
          </div>
        </Modal>
      );
    }

    // ─── INLINE NEW CUSTOMER (from edit mode) ────────────────────────
    function InlineNewCustomer({onSave,onCancel}){
      const[name,setName]=useState("");
      const[address,setAddress]=useState("");
      return(
        <div style={{background:"#111820",border:"1px solid #1e2a35",borderRadius:"8px",padding:"12px",marginTop:"8px"}}>
          <div style={{fontSize:"11px",color:"#f97316",fontFamily:"'DM Mono',monospace",marginBottom:"8px"}}>QUICK ADD CUSTOMER</div>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Business name" style={{...inputStyle,marginBottom:"8px",fontSize:"12px",padding:"8px 10px"}}/>
          <input value={address} onChange={e=>setAddress(e.target.value)} placeholder="Address" style={{...inputStyle,marginBottom:"8px",fontSize:"12px",padding:"8px 10px"}}/>
          <div style={{display:"flex",gap:"6px",justifyContent:"flex-end"}}>
            <button onClick={onCancel} style={{...btnSecondary,padding:"6px 12px",fontSize:"11px"}}>Cancel</button>
            <button onClick={()=>{if(name.trim())onSave({name:name.trim(),address:address.trim(),contact:"",phone:"",email:"",type:"Independent Shop",notes:""});}} style={{...btnPrimary,padding:"6px 12px",fontSize:"11px"}}>Add</button>
          </div>
        </div>
      );
    }

    // ─── KB ENTRY MODAL ──────────────────────────────────────────────
    function NewKBEntryModal({onClose,onSave,category}){
      const[form,setForm]=useState({title:"",content:"",tags:""});const set=(k,v)=>setForm(f=>({...f,[k]:v}));
      const cl={procedures:"Procedure",dtcMaps:"DTC Map",fileLibrary:"File Entry"};
      return(<Modal onClose={onClose} title={`New ${cl[category]||"Entry"}`}><FormField label="Title"><input value={form.title} onChange={e=>set("title",e.target.value)} placeholder="Title" style={inputStyle}/></FormField><FormField label="Content"><textarea value={form.content} onChange={e=>set("content",e.target.value)} rows={5} placeholder="Details..." style={{...inputStyle,resize:"vertical"}}/></FormField><FormField label="Tags (comma separated)"><input value={form.tags} onChange={e=>set("tags",e.target.value)} placeholder="Stellantis, GPEC2" style={inputStyle}/></FormField><div style={{display:"flex",gap:"10px",justifyContent:"flex-end",marginTop:"6px"}}><button onClick={onClose} style={btnSecondary}>Cancel</button><button onClick={()=>{onSave(category,{...form,tags:form.tags.split(",").map(t=>t.trim()).filter(Boolean),updated:new Date().toISOString().split("T")[0]});onClose();}} style={btnPrimary}>Save</button></div></Modal>);
    }

    // ─── VEHICLE MODAL ───────────────────────────────────────────────
    function NewVehicleModal({onClose,onSave}){
      const[form,setForm]=useState({make:"",model:"",years:"",engines:"",ecus:"",modules:"",protocols:"",notes:""});const set=(k,v)=>setForm(f=>({...f,[k]:v}));
      return(<Modal onClose={onClose} title="New Vehicle Entry" width={620}><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"14px"}}><FormField label="Make"><input value={form.make} onChange={e=>set("make",e.target.value)} style={inputStyle}/></FormField><FormField label="Model"><input value={form.model} onChange={e=>set("model",e.target.value)} style={inputStyle}/></FormField><FormField label="Years"><input value={form.years} onChange={e=>set("years",e.target.value)} style={inputStyle}/></FormField></div><FormField label="Engines (comma sep)"><input value={form.engines} onChange={e=>set("engines",e.target.value)} style={inputStyle}/></FormField><FormField label="ECU Platforms (comma sep)"><input value={form.ecus} onChange={e=>set("ecus",e.target.value)} style={inputStyle}/></FormField><FormField label="Modules (comma sep)"><input value={form.modules} onChange={e=>set("modules",e.target.value)} style={inputStyle}/></FormField><FormField label="Protocols (comma sep)"><input value={form.protocols} onChange={e=>set("protocols",e.target.value)} style={inputStyle}/></FormField><FormField label="Notes"><textarea value={form.notes} onChange={e=>set("notes",e.target.value)} rows={2} style={{...inputStyle,resize:"vertical"}}/></FormField><div style={{display:"flex",gap:"10px",justifyContent:"flex-end",marginTop:"6px"}}><button onClick={onClose} style={btnSecondary}>Cancel</button><button onClick={()=>{onSave({...form,engines:form.engines.split(",").map(s=>s.trim()).filter(Boolean),ecus:form.ecus.split(",").map(s=>s.trim()).filter(Boolean),modules:form.modules.split(",").map(s=>s.trim()).filter(Boolean),protocols:form.protocols.split(",").map(s=>s.trim()).filter(Boolean)});onClose();}} style={btnPrimary}>Save</button></div></Modal>);
    }

    // ─── PAYMENT SECTION ────────────────────────────────────────────
    function PaymentSection({job,onUpdate}){
      const[showAdd,setShowAdd]=useState(false);
      const[payAmt,setPayAmt]=useState("");
      const[payNote,setPayNote]=useState("");
      const payments=Array.isArray(job.payments)?job.payments:[];
      const totalPaid=payments.reduce((s,p)=>s+(p.amount||0),0);
      const totalDue=job.amount||0;
      const balance=totalDue-totalPaid;
      const pctPaid=totalDue>0?Math.min(100,Math.round((totalPaid/totalDue)*100)):0;
      const isPaidFull=balance<=0&&totalDue>0;

      const addPayment=()=>{
        const amt=Number(payAmt);if(!amt||amt<=0)return;
        const newPayment={amount:amt,note:payNote.trim()||"Payment",date:new Date().toISOString()};
        const updated=[...payments,newPayment];
        const nowPaid=updated.reduce((s,p)=>s+(p.amount||0),0)>=totalDue;
        onUpdate(job.id,{payments:updated,paid:nowPaid});
        setPayAmt("");setPayNote("");setShowAdd(false);
      };

      const markPaidInFull=()=>{
        if(totalDue<=0)return;
        const remaining=totalDue-totalPaid;
        const fullPayment={amount:remaining>0?remaining:totalDue,note:"Paid in Full",date:new Date().toISOString()};
        const updated=remaining>0?[...payments,fullPayment]:[...payments];
        fireConfetti("#4ade80");
        onUpdate(job.id,{payments:updated,paid:true,status:"Completed"});
      };

      const removePayment=(i)=>{
        const updated=payments.filter((_,idx)=>idx!==i);
        const nowPaid=totalDue>0&&updated.reduce((s,p)=>s+(p.amount||0),0)>=totalDue;
        onUpdate(job.id,{payments:updated,paid:nowPaid});
      };

      return(
        <div style={{marginTop:"16px",marginBottom:"8px"}}>
          {/* Summary bar */}
          <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #111820"}}>
            <span style={{fontSize:"12px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.6px",fontFamily:"'DM Mono',monospace"}}>Total Amount</span>
            <span style={{fontSize:"13px",color:"#e2e8f0",fontFamily:"'DM Mono',monospace",fontWeight:700}}>${totalDue.toLocaleString()}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #111820"}}>
            <span style={{fontSize:"12px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.6px",fontFamily:"'DM Mono',monospace"}}>Paid</span>
            <span style={{fontSize:"13px",color:"#4ade80",fontFamily:"'DM Mono',monospace",fontWeight:700}}>${totalPaid.toLocaleString()}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #111820"}}>
            <span style={{fontSize:"12px",color:isPaidFull?"#4ade80":"#f59e0b",textTransform:"uppercase",letterSpacing:"0.6px",fontFamily:"'DM Mono',monospace",fontWeight:600}}>{isPaidFull?"PAID IN FULL":"Balance Due"}</span>
            <span style={{fontSize:"13px",color:isPaidFull?"#4ade80":"#f59e0b",fontFamily:"'DM Mono',monospace",fontWeight:700}}>{isPaidFull?"✓":"$"+balance.toLocaleString()}</span>
          </div>

          {/* Progress bar */}
          {totalDue>0&&<div style={{margin:"12px 0",background:"#111820",borderRadius:"4px",height:6,overflow:"hidden"}}>
            <div style={{height:"100%",borderRadius:"4px",background:isPaidFull?"#4ade80":"#f97316",width:`${pctPaid}%`,transition:"width 0.3s"}}/>
          </div>}

          {/* Payment history */}
          {payments.length>0&&(
            <div style={{marginTop:"8px"}}>
              {[...payments].reverse().map((p,i)=>{
                const realIdx=payments.length-1-i;
                return(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:"1px solid #0f1419"}}>
                    <div>
                      <div style={{fontSize:"12px",color:"#cbd5e1",fontFamily:"'DM Mono',monospace"}}>${p.amount.toLocaleString()} — {p.note||"Payment"}</div>
                      <div style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace",marginTop:"2px"}}>{formatNoteTime(p.date)}</div>
                    </div>
                    <button onClick={()=>removePayment(realIdx)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"12px"}}>✕</button>
                  </div>
                );
              })}
            </div>
          )}

          {/* Paid in Full shortcut */}
          {!isPaidFull&&totalDue>0&&(
            <button onClick={markPaidInFull} style={{width:"100%",marginTop:"10px",padding:"12px",background:"#1a3a2a",border:"1px solid #2a4a2a",borderRadius:"8px",color:"#4ade80",fontSize:"13px",cursor:"pointer",fontWeight:700,fontFamily:"'DM Mono',monospace",letterSpacing:"0.5px"}}>Paid in Full</button>
          )}

          {/* Add payment form */}
          {!showAdd?(
            <button onClick={()=>setShowAdd(true)} style={{...btnPrimary,width:"100%",marginTop:"10px",background:isPaidFull?"#1a2a1a":"#f97316",color:isPaidFull?"#4ade80":"#0a0e13",border:isPaidFull?"1px solid #2a4a2a":"none"}}>{isPaidFull?"+ Add Additional Payment":"+ Record Payment"}</button>
          ):(
            <div style={{background:"#111820",border:"1px solid #1e2a35",borderRadius:"8px",padding:"12px",marginTop:"10px"}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"8px"}}>
                <input type="number" value={payAmt} onChange={e=>setPayAmt(e.target.value)} placeholder="Amount" style={{...inputStyle,fontSize:"12px",padding:"8px 10px"}} onKeyDown={e=>{if(e.key==="Enter")addPayment();}}/>
                <input value={payNote} onChange={e=>setPayNote(e.target.value)} placeholder="Deposit, Final, etc." style={{...inputStyle,fontSize:"12px",padding:"8px 10px"}} onKeyDown={e=>{if(e.key==="Enter")addPayment();}}/>
              </div>
              <div style={{display:"flex",gap:"6px",justifyContent:"flex-end"}}>
                <button onClick={()=>{setShowAdd(false);setPayAmt("");setPayNote("");}} style={{...btnSecondary,padding:"6px 12px",fontSize:"11px"}}>Cancel</button>
                <button onClick={addPayment} style={{...btnPrimary,padding:"6px 12px",fontSize:"11px"}}>Record</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── INVOICE MODAL ─────────────────────────────────────────────
    function InvoiceSuccess({result,job,billTo,billToPhone,subtotal,totalPaid,invoiceNo,cust,onClose}){
      const[payLink,setPayLink]=useState(null);
      const[linkLoading,setLinkLoading]=useState(false);
      const[linkError,setLinkError]=useState("");
      const[copied,setCopied]=useState(false);
      const[stripeReady,setStripeReady]=useState(false);
      const[emailReady,setEmailReady]=useState(false);
      const[emailTo,setEmailTo]=useState(cust?.email||"");
      const[emailSending,setEmailSending]=useState(false);
      const[emailMsg,setEmailMsg]=useState("");

      const balance=subtotal-totalPaid;

      useEffect(()=>{
        api.server.stripe.configStatus().then(r=>{if(r.configured)setStripeReady(true);}).catch(()=>{});
        api.server.email.configStatus().then(r=>{if(r.configured)setEmailReady(true);}).catch(()=>{});
      },[]);

      const createLink=async()=>{
        setLinkLoading(true);setLinkError("");
        try{
          const r=await api.server.stripe.createPaymentLink({
            invoiceNo:invoiceNo,amount:balance,customerName:billTo,
            customerEmail:cust?.email||"",customerPhone:billToPhone||"",
            description:`Invoice #${invoiceNo} — ${job.type||"Service"}`,jobId:job.id
          });
          if(r.error){setLinkError(r.error);}
          else if(r.paymentLink){setPayLink(r.paymentLink);}
        }catch(e){setLinkError(e.message);}
        setLinkLoading(false);
      };

      const copyLink=()=>{if(payLink?.url){navigator.clipboard.writeText(payLink.url).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});}};
      const copyMessage=()=>{
        const msg=`Hi ${billTo}, your invoice #${invoiceNo} for $${balance.toFixed(2)} from Good Car Solutions is ready.\n\nPay here: ${payLink.url}\n\nThank you for your business!`;
        navigator.clipboard.writeText(msg).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
      };

      const sendEmail=async()=>{
        if(!emailTo){setEmailMsg("Enter an email address");return;}
        setEmailSending(true);setEmailMsg("");
        const r=await api.server.email.sendInvoice({
          to:emailTo,customerName:billTo,invoiceNo:invoiceNo,
          amount:balance,paymentUrl:payLink?.url||"",
          jobDescription:job.type||"Service"
        });
        if(r.error){setEmailMsg("✗ "+r.error);}
        else{setEmailMsg("✓ Invoice emailed to "+emailTo);fireConfetti("#4ade80");}
        setEmailSending(false);
      };

      return(
        <Modal onClose={onClose} title="Invoice Generated" width={500}>
          <div style={{padding:"20px 0"}}>
            <div style={{textAlign:"center",marginBottom:"24px"}}>
              <div style={{fontSize:"48px",marginBottom:"12px"}}>✓</div>
              <div style={{fontSize:"16px",color:"#4ade80",fontWeight:600,marginBottom:"6px"}}>Invoice #{result.invoiceNo} Created</div>
              <div style={{fontSize:"12px",color:"#475569",fontFamily:"'DM Mono',monospace",wordBreak:"break-all"}}>{result.path}</div>
            </div>

            <div style={{display:"flex",gap:"10px",justifyContent:"center",marginBottom:"20px"}}>
              <button onClick={()=>api.invoice.open(result.path)} style={btnPrimary}>Open PDF</button>
              <button onClick={async()=>{const veh=(job.vehicle||"").replace(/[^a-zA-Z0-9 .-]/g,"").replace(/\s+/g,"_").substring(0,40);await api.invoice.save(result.path,`invoice_${result.invoiceNo}${veh?"_"+veh:""}.pdf`);}} style={btnSecondary}>Save As...</button>
              <button onClick={onClose} style={btnSecondary}>Done</button>
            </div>

            {stripeReady&&balance>0&&!payLink&&(
              <div style={{borderTop:"1px solid #1e2a35",paddingTop:"20px"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"12px"}}>
                  <div><div style={{fontSize:"13px",color:"#e2e8f0",fontWeight:600}}>Send Payment Link</div><div style={{fontSize:"11px",color:"#475569"}}>Create a Stripe payment link for ${balance.toFixed(2)}</div></div>
                  <button onClick={createLink} disabled={linkLoading} style={{...btnPrimary,background:"#6366f1",fontSize:"12px"}}>{linkLoading?"Creating...":"Create Link"}</button>
                </div>
                {linkError&&<div style={{fontSize:"12px",color:"#f87171",fontFamily:"'DM Mono',monospace"}}>{linkError}</div>}
              </div>
            )}

            {payLink&&(
              <div style={{borderTop:"1px solid #1e2a35",paddingTop:"20px"}}>
                <div style={{fontSize:"13px",color:"#e2e8f0",fontWeight:600,marginBottom:"10px"}}>Payment Link Ready</div>
                <div style={{background:"#111820",border:"1px solid #1e2a35",borderRadius:"8px",padding:"12px",marginBottom:"12px"}}>
                  <div style={{fontSize:"12px",color:"#60a5fa",fontFamily:"'DM Mono',monospace",wordBreak:"break-all",lineHeight:1.5}}>{payLink.url}</div>
                </div>
                <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"16px"}}>
                  <button onClick={copyLink} style={{...btnPrimary,background:"#6366f1",fontSize:"12px"}}>{copied?"Copied!":"Copy Link"}</button>
                  <button onClick={copyMessage} style={{...btnSecondary,fontSize:"12px"}}>Copy Text Message</button>
                </div>

                {emailReady&&(
                  <div style={{background:"#111820",border:"1px solid #1e2a35",borderRadius:"8px",padding:"14px"}}>
                    <div style={{fontSize:"12px",color:"#94a3b8",fontWeight:600,marginBottom:"8px"}}>Email Invoice + Payment Link</div>
                    <div style={{display:"flex",gap:"8px"}}>
                      <input value={emailTo} onChange={e=>setEmailTo(e.target.value)} placeholder="customer@email.com" style={{...inputStyle,flex:1,fontSize:"12px"}} onKeyDown={e=>{if(e.key==="Enter")sendEmail();}}/>
                      <button onClick={sendEmail} disabled={emailSending} style={{...btnPrimary,fontSize:"12px",whiteSpace:"nowrap"}}>{emailSending?"Sending...":"Send Email"}</button>
                    </div>
                    {emailMsg&&<div style={{marginTop:"8px",fontSize:"11px",color:emailMsg.startsWith("✓")?"#4ade80":"#f87171",fontFamily:"'DM Mono',monospace"}}>{emailMsg}</div>}
                  </div>
                )}
              </div>
            )}

            {!stripeReady&&balance>0&&emailReady&&(
              <div style={{borderTop:"1px solid #1e2a35",paddingTop:"20px"}}>
                <div style={{background:"#111820",border:"1px solid #1e2a35",borderRadius:"8px",padding:"14px"}}>
                  <div style={{fontSize:"12px",color:"#94a3b8",fontWeight:600,marginBottom:"8px"}}>Email Invoice</div>
                  <div style={{display:"flex",gap:"8px"}}>
                    <input value={emailTo} onChange={e=>setEmailTo(e.target.value)} placeholder="customer@email.com" style={{...inputStyle,flex:1,fontSize:"12px"}} onKeyDown={e=>{if(e.key==="Enter")sendEmail();}}/>
                    <button onClick={sendEmail} disabled={emailSending} style={{...btnPrimary,fontSize:"12px",whiteSpace:"nowrap"}}>{emailSending?"Sending...":"Send Email"}</button>
                  </div>
                  {emailMsg&&<div style={{marginTop:"8px",fontSize:"11px",color:emailMsg.startsWith("✓")?"#4ade80":"#f87171",fontFamily:"'DM Mono',monospace"}}>{emailMsg}</div>}
                </div>
              </div>
            )}

            {stripeReady&&balance<=0&&(
              <div style={{borderTop:"1px solid #1e2a35",paddingTop:"16px",textAlign:"center"}}>
                <div style={{fontSize:"12px",color:"#4ade80",fontFamily:"'DM Mono',monospace"}}>Invoice fully paid — no payment link needed</div>
              </div>
            )}

            {!stripeReady&&!emailReady&&balance>0&&(
              <div style={{borderTop:"1px solid #1e2a35",paddingTop:"16px",textAlign:"center"}}>
                <div style={{fontSize:"11px",color:"#475569"}}>Connect Stripe and/or Email in Settings to send invoices digitally</div>
              </div>
            )}
          </div>
        </Modal>
      );
    }

    function InvoiceModal({job,customers,onClose,isServer}){
      const timeline=Array.isArray(job.notes)?job.notes:[];
      const payments=Array.isArray(job.payments)?job.payments:[];
      const totalPaid=payments.reduce((s,p)=>s+(p.amount||0),0);
      const cust=customers.find(c=>c.name===job.customer);
      const draft=job.invoiceDraft||{};
      const hasDraft=Object.keys(draft).length>0;

      const[invoiceNo,setInvoiceNo]=useState(job.invoiceNo||"");
      const[billTo,setBillTo]=useState(draft.billTo||job.customer||"");
      const[billToPhone,setBillToPhone]=useState(draft.billToPhone||cust?.phone||"");
      const[date,setDate]=useState(new Date().toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}));
      const[terms,setTerms]=useState(draft.terms||"NET 0");
      const[dueDate,setDueDate]=useState(new Date().toLocaleDateString("en-US",{month:"2-digit",day:"2-digit",year:"numeric"}));
      const[vehicle,setVehicle]=useState(job.vehicle||"");
      const[vin,setVin]=useState(job.vin||"");
      const savedLI=job.lineItems&&job.lineItems.length>0?job.lineItems:[{description:job.type||"Service",quantity:1,rate:job.amount||0,amount:job.amount||0}];
      const[lineItems,setLineItems]=useState(savedLI);
      const[comments,setComments]=useState(draft.comments||"Auto Service Professional - Experience since 1982 - Mechanic - Electricity - Computer Diagnostic - Brakes - A/C - Electronic circuits - Maintenance - Online Software Tech Support - And more.");
      const[payInstructions,setPayInstructions]=useState(draft.paymentInstructions||"All sales are final no return or exchanges. 60 day warranty on service only to the scope of the work.");
      const[includeNotes,setIncludeNotes]=useState(true);
      const[selectedPdfs,setSelectedPdfs]=useState({});
      const[selectedImgs,setSelectedImgs]=useState({});
      const[generating,setGenerating]=useState(false);
      const[saving,setSaving]=useState(false);
      const[result,setResult]=useState(null);
      const[error,setError]=useState("");

      // Get invoice number on mount — only if job doesnt already have one locked
      useEffect(()=>{if(!job.invoiceNo){api.invoice.getNextNumber().then(n=>setInvoiceNo(String(n)));}},[]);



      // Collect PDF and image attachments from timeline
      const pdfAttachments=timeline.filter(e=>e.type==="file"&&e.file?.extension==="pdf");
      const imgAttachments=timeline.filter(e=>e.type==="file"&&e.file&&["jpg","jpeg","png"].includes((e.file.extension||"").toLowerCase()));

      const addLineItem=()=>setLineItems(p=>[...p,{description:"",quantity:1,rate:0,amount:0}]);
      const updateLineItem=(i,field,val)=>{setLineItems(p=>{const u=[...p];u[i]={...u[i],[field]:val};if(field==="quantity"||field==="rate"){u[i].amount=(Number(u[i].quantity)||0)*(Number(u[i].rate)||0);}return u;});};
      const removeLineItem=(i)=>setLineItems(p=>p.filter((_,idx)=>idx!==i));
      const subtotal=lineItems.reduce((s,li)=>s+(Number(li.amount)||0),0);

      // Collect notes text
      const notesText=includeNotes?timeline.filter(e=>e.type==="note").map(e=>`[${new Date(e.timestamp).toLocaleDateString()}] ${e.text}`).join("\n"):"";

      const saveDraft=async()=>{
        setSaving(true);setError("");
        try{
          const cleanLI=lineItems.map(li=>({description:li.description,quantity:Number(li.quantity)||1,rate:Number(li.rate)||0,amount:Number(li.amount)||0}));
          const draftData={billTo,billToPhone,billToEmail:cust?.email||"",paymentInstructions:payInstructions,comments,terms};
          if(isServer){
            await api.server.request("PUT",`/jobs/${job.id}`,{lineItems:cleanLI,amount:subtotal,invoiceDraft:draftData});
          }
          setSaving(false);
          setTimeout(()=>setSaving(false),0);
        }catch(e){setError("Save failed: "+e.message);setSaving(false);}
      };
      const generate=async()=>{
        setGenerating(true);setError("");
        try{
          const attachPaths=[];
          const fileApiInv=isServer?api.server.files:api.files;
          for(const entry of pdfAttachments){
            if(selectedPdfs[entry.file.id]){
              const fp=await fileApiInv.getPath(entry.file.storedName);
              attachPaths.push(fp);
            }
          }
          for(const entry of imgAttachments){
            if(selectedImgs[entry.file.id]){
              const fp=await fileApiInv.getPath(entry.file.storedName);
              attachPaths.push(fp);
            }
          }

          // Save line items back to job and clear draft
          const cleanLI=lineItems.map(li=>({description:li.description,quantity:Number(li.quantity)||1,rate:Number(li.rate)||0,amount:Number(li.amount)||0}));
          if(isServer){
            await api.server.request("PUT",`/jobs/${job.id}`,{lineItems:cleanLI,amount:subtotal,invoiceDraft:null});
          }

          const data={
            invoiceNo:invoiceNo,
            billTo:billTo,
            billToPhone:billToPhone,
            date:date,
            terms:terms,
            dueDate:dueDate,
            vehicle:vehicle,
            vin:vin,
            lineItems:lineItems.map(li=>({description:li.description,quantity:Number(li.quantity)||1,rate:Number(li.rate)||0,amount:Number(li.amount)||0})),
            subtotal:subtotal,
            total:subtotal,
            paid:totalPaid,
            paymentInstructions:payInstructions,
            comments:comments,
            notes:notesText,
            attachmentPaths:attachPaths
          };

          const r=await api.invoice.generate(data);
          if(r.success){
            // Only increment counter if this was a new number (job didn't already have one locked)
            if(!job.invoiceNo){
              await api.invoice.incrementNumber();
              // Lock invoice number to job so it never changes
              if(isServer){
                await api.server.request("PUT",`/jobs/${job.id}`,{invoiceNo:invoiceNo});
              } else {
                await api.jobs.update(job.id,{invoiceNo:invoiceNo});
              }
            }
            setResult(r);
          } else {
            setError(r.error||"Unknown error generating invoice");
          }
        }catch(e){console.error("Invoice error:",e);setError(e.message||"Failed to generate invoice");}
        setGenerating(false);
      };

      if(result){
        return <InvoiceSuccess result={result} job={job} billTo={billTo} billToPhone={billToPhone} subtotal={subtotal} totalPaid={totalPaid} invoiceNo={invoiceNo} cust={cust} onClose={onClose}/>;
      }

      return(
        <Modal onClose={onClose} title={`Generate Invoice — ${job.id}`} width={680}>
          <div style={{maxHeight:"70vh",overflow:"auto",paddingRight:"4px"}}>

            {/* Invoice Info */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"16px"}}>
              <FormField label={job.invoiceNo?"Invoice No 🔒":"Invoice No"}><input value={invoiceNo} onChange={e=>{if(!job.invoiceNo)setInvoiceNo(e.target.value)}} readOnly={!!job.invoiceNo} style={{...inputStyle,...(job.invoiceNo?{opacity:0.7,cursor:"not-allowed"}:{})}}/></FormField>
              <FormField label="Date"><input value={date} onChange={e=>setDate(e.target.value)} style={inputStyle}/></FormField>
              <FormField label="Due Date"><input value={dueDate} onChange={e=>setDueDate(e.target.value)} style={inputStyle}/></FormField>
            </div>

            {/* Bill To */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"16px"}}>
              <FormField label="Bill To"><input value={billTo} onChange={e=>setBillTo(e.target.value)} style={inputStyle}/></FormField>
              <FormField label="Phone"><input value={billToPhone} onChange={e=>setBillToPhone(e.target.value)} style={inputStyle}/></FormField>
            </div>
            <FormField label="Terms"><input value={terms} onChange={e=>setTerms(e.target.value)} style={inputStyle}/></FormField>

            {/* Vehicle */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"16px"}}>
              <FormField label="Vehicle"><input value={vehicle} onChange={e=>setVehicle(e.target.value)} style={inputStyle}/></FormField>
              <FormField label="VIN"><input value={vin} onChange={e=>setVin(e.target.value)} style={inputStyle}/></FormField>
            </div>

            {/* Line Items */}
            <div style={{marginBottom:"16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
                <div style={{fontSize:"11px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.8px",fontFamily:"'DM Mono',monospace"}}>Line Items</div>
                <button onClick={addLineItem} style={{background:"none",border:"none",color:"#f97316",fontSize:"11px",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>+ Add Item</button>
              </div>
              <div style={{background:"#0a0e13",border:"1px solid #1e2a35",borderRadius:"8px",overflow:"hidden"}}>
                <div style={{display:"grid",gridTemplateColumns:"2fr 60px 90px 90px 28px",gap:"0",padding:"8px 10px",borderBottom:"1px solid #1e2a35"}}>
                  {["Description","Qty","Rate","Amount",""].map(h=><div key={h} style={{fontSize:"9px",color:"#475569",textTransform:"uppercase",letterSpacing:"0.8px",fontFamily:"'DM Mono',monospace"}}>{h}</div>)}
                </div>
                {lineItems.map((li,i)=>(
                  <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 60px 90px 90px 28px",gap:"4px",padding:"6px 10px",borderBottom:"1px solid #111820",alignItems:"center"}}>
                    <input value={li.description} onChange={e=>updateLineItem(i,"description",e.target.value)} style={{...inputStyle,padding:"6px 8px",fontSize:"12px",border:"none",background:"transparent"}}/>
                    <input type="number" value={li.quantity} onChange={e=>updateLineItem(i,"quantity",e.target.value)} style={{...inputStyle,padding:"6px 8px",fontSize:"12px",border:"none",background:"transparent",textAlign:"center"}}/>
                    <input type="number" value={li.rate} onChange={e=>updateLineItem(i,"rate",e.target.value)} style={{...inputStyle,padding:"6px 8px",fontSize:"12px",border:"none",background:"transparent",textAlign:"right"}}/>
                    <div style={{fontSize:"12px",color:"#e2e8f0",fontFamily:"'DM Mono',monospace",textAlign:"right",padding:"6px 8px"}}>${(Number(li.amount)||0).toFixed(2)}</div>
                    <button onClick={()=>removeLineItem(i)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"12px"}}>✕</button>
                  </div>
                ))}
                <div style={{display:"flex",justifyContent:"flex-end",padding:"10px",gap:"20px",borderTop:"1px solid #1e2a35"}}>
                  <span style={{fontSize:"12px",color:"#64748b",fontFamily:"'DM Mono',monospace"}}>Subtotal:</span>
                  <span style={{fontSize:"14px",color:"#e2e8f0",fontFamily:"'DM Mono',monospace",fontWeight:700}}>${subtotal.toFixed(2)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"flex-end",padding:"0 10px 10px",gap:"20px"}}>
                  <span style={{fontSize:"12px",color:"#4ade80",fontFamily:"'DM Mono',monospace"}}>Paid:</span>
                  <span style={{fontSize:"14px",color:"#4ade80",fontFamily:"'DM Mono',monospace",fontWeight:700}}>${totalPaid.toFixed(2)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"flex-end",padding:"0 10px 10px",gap:"20px"}}>
                  <span style={{fontSize:"12px",color:subtotal-totalPaid<=0?"#4ade80":"#fbbf24",fontFamily:"'DM Mono',monospace"}}>Balance:</span>
                  <span style={{fontSize:"14px",color:subtotal-totalPaid<=0?"#4ade80":"#fbbf24",fontFamily:"'DM Mono',monospace",fontWeight:700}}>${Math.max(0,subtotal-totalPaid).toFixed(2)}</span>
                </div>
              </div>
            </div>

            {/* Payment Instructions */}
            <FormField label="Payment Instructions"><textarea value={payInstructions} onChange={e=>setPayInstructions(e.target.value)} rows={2} style={{...inputStyle,resize:"vertical",fontSize:"12px"}}/></FormField>

            {/* Comments */}
            <FormField label="Comments"><textarea value={comments} onChange={e=>setComments(e.target.value)} rows={2} style={{...inputStyle,resize:"vertical",fontSize:"12px"}}/></FormField>

            {/* Include Notes */}
            <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"14px",cursor:"pointer"}} onClick={()=>setIncludeNotes(!includeNotes)}>
              <div style={{width:18,height:18,borderRadius:"4px",border:"1px solid",borderColor:includeNotes?"#f97316":"#1e2a35",background:includeNotes?"#f97316":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",color:"#0a0e13",fontWeight:700}}>{includeNotes?"✓":""}</div>
              <span style={{fontSize:"12px",color:"#94a3b8"}}>Include timeline notes in invoice ({timeline.filter(e=>e.type==="note").length} notes)</span>
            </div>

            {/* Attach PDFs */}
            {pdfAttachments.length>0&&(
              <div style={{marginBottom:"16px"}}>
                <div style={{fontSize:"11px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.8px",fontFamily:"'DM Mono',monospace",marginBottom:"8px"}}>Attach PDF Reports as Additional Pages</div>
                {pdfAttachments.map(entry=>(
                  <div key={entry.file.id} style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px",cursor:"pointer"}} onClick={()=>setSelectedPdfs(p=>({...p,[entry.file.id]:!p[entry.file.id]}))}>
                    <div style={{width:18,height:18,borderRadius:"4px",border:"1px solid",borderColor:selectedPdfs[entry.file.id]?"#60a5fa":"#1e2a35",background:selectedPdfs[entry.file.id]?"#60a5fa":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",color:"#0a0e13",fontWeight:700}}>{selectedPdfs[entry.file.id]?"✓":""}</div>
                    <span style={{fontSize:"12px",color:"#94a3b8"}}>📄 {entry.file.originalName} ({formatBytes(entry.file.size)})</span>
                  </div>
                ))}
              </div>
            )}

            {/* Attach Images */}
            {imgAttachments.length>0&&(
              <div style={{marginBottom:"16px"}}>
                <div style={{fontSize:"11px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.8px",fontFamily:"'DM Mono',monospace",marginBottom:"8px"}}>Attach Photos as Additional Pages</div>
                {imgAttachments.map(entry=>(
                  <div key={entry.file.id} style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px",cursor:"pointer"}} onClick={()=>setSelectedImgs(p=>({...p,[entry.file.id]:!p[entry.file.id]}))}>
                    <div style={{width:18,height:18,borderRadius:"4px",border:"1px solid",borderColor:selectedImgs[entry.file.id]?"#4ade80":"#1e2a35",background:selectedImgs[entry.file.id]?"#4ade80":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",color:"#0a0e13",fontWeight:700}}>{selectedImgs[entry.file.id]?"✓":""}</div>
                    <span style={{fontSize:"12px",color:"#94a3b8"}}>🖼️ {entry.file.originalName}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:"10px",justifyContent:"flex-end",marginTop:"16px",paddingTop:"16px",borderTop:"1px solid #1e2a35",flexWrap:"wrap",alignItems:"center"}}>
            {error&&<div style={{width:"100%",background:"#3a1a1a",border:"1px solid #5a2020",borderRadius:"6px",padding:"10px 12px",fontSize:"12px",color:"#f87171",fontFamily:"'DM Mono',monospace"}}>{error}</div>}
            {hasDraft&&<div style={{fontSize:"11px",color:"#60a5fa",marginRight:"auto",fontFamily:"'DM Mono',monospace"}}>📋 Restored from draft</div>}
            <button onClick={onClose} style={btnSecondary}>Cancel</button>
            <button onClick={saveDraft} disabled={saving} style={{...btnSecondary,borderColor:saving?"#4ade80":"#1e2a35",color:saving?"#4ade80":"#94a3b8"}}>{saving?"✓ Saved!":"💾 Save Draft"}</button>
            <button onClick={generate} disabled={generating} style={{...btnPrimary,opacity:generating?0.6:1}}>{generating?"Generating...":"Generate Invoice"}</button>
          </div>
        </Modal>
      );
    }

    // ─── JOB DETAIL PANEL ────────────────────────────────────────────
    // Inline image thumbnail loader
    function ImageThumb({storedName,fileApi,onClick,caption}){
      const[src,setSrc]=useState(null);
      useEffect(()=>{
        let cancelled=false;
        fileApi.previewData(storedName).then(d=>{if(!cancelled&&d)setSrc(d);}).catch(()=>{});
        return()=>{cancelled=true;};
      },[storedName]);
      if(!src)return null;
      return(
        <div onClick={onClick} style={{cursor:"pointer",borderRadius:"8px",overflow:"hidden",border:"1px solid #1e2a35",marginTop:"6px",position:"relative"}} onMouseOver={e=>e.currentTarget.style.borderColor="#2a4a6a"} onMouseOut={e=>e.currentTarget.style.borderColor="#1e2a35"}>
          <img src={src} style={{width:"100%",maxHeight:200,objectFit:"cover",display:"block"}} alt={caption||""}/>
          {caption&&<div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,0.7))",padding:"20px 10px 8px",fontSize:"11px",color:"#e2e8f0",fontWeight:500}}>{caption}</div>}
        </div>
      );
    }

    function JobDetailPanel({job,customers,onClose,onUpdate,onDelete,onCreateCustomer,isServer}){
      if(!job)return null;
      const{types:jobTypes,addType:addServiceType}=useContext(JOB_TYPES_CTX);
      const[editing,setEditing]=useState(false);
      const[form,setForm]=useState({});
      const[newNote,setNewNote]=useState("");
      const[showInlineCustomer,setShowInlineCustomer]=useState(false);
      const[showInvoice,setShowInvoice]=useState(false);

      // Normalize timeline
      const timeline=Array.isArray(job.notes)?job.notes:(job.notes?[{type:"note",text:job.notes,timestamp:job.createdAt||new Date().toISOString()}]:[]);

      const startEdit=()=>{
        const custMatch=customers.find(c=>c.name===job.customer);
        setForm({vehicle:job.vehicle||"",vin:job.vin||"",customerId:custMatch?.id||"",type:job.type||"ECU Programming",ecu:job.ecu||"",tools:job.tools||"",date:job.date||"",amount:job.amount||0,priority:job.priority||"Medium",serviceAddress:job.serviceAddress||""});
        setEditing(true);setShowInlineCustomer(false);
      };
      const saveEdit=()=>{
        const cust=customers.find(c=>c.id===form.customerId);
        onUpdate(job.id,{...form,customer:cust?.name||job.customer,amount:Number(form.amount)||0});
        setEditing(false);
      };
      const set=(k,v)=>setForm(f=>({...f,[k]:v}));

      const addNote=()=>{if(!newNote.trim())return;const u=[...timeline,{type:"note",text:newNote.trim(),timestamp:new Date().toISOString()}];onUpdate(job.id,{notes:u});setNewNote("");};
      const fileApi=isServer?api.server.files:api.files;
      const[attachComment,setAttachComment]=useState("");
      const[showAttachModal,setShowAttachModal]=useState(false);
      const[stagedFiles,setStagedFiles]=useState([]);
      const[previewFile,setPreviewFile]=useState(null); // {url,type,name}

      const handleAttach=async()=>{const files=await fileApi.pick();if(!files||files.length===0)return;setStagedFiles(files);setAttachComment("");setShowAttachModal(true);};
      const confirmAttach=()=>{
        const entries=stagedFiles.map(f=>({type:"file",file:f,text:attachComment.trim()||f.originalName,timestamp:f.addedAt||new Date().toISOString()}));
        onUpdate(job.id,{notes:[...timeline,...entries]});
        setShowAttachModal(false);setStagedFiles([]);setAttachComment("");
      };

      const openPreview=async(entry)=>{
        const ext=entry.file?.extension||"";
        const isImg=["jpg","jpeg","png","gif","webp"].includes(ext);
        const isPdf=ext==="pdf";
        if(!isImg&&!isPdf){fileApi.open(entry.file?.storedName);return;}
        try{
          const dataUrl=await fileApi.previewData(entry.file?.storedName);
          if(dataUrl){
            const caption=entry.text&&!entry.text.startsWith("Attached: ")?entry.text:"";
            setPreviewFile({url:dataUrl,type:isImg?"image":"pdf",name:entry.file.originalName,caption,storedName:entry.file.storedName});
          } else {fileApi.open(entry.file?.storedName);}
        }catch(e){fileApi.open(entry.file?.storedName);}
      };
      const deleteTimelineEntry=(i)=>{const u=timeline.filter((_,idx)=>idx!==i);onUpdate(job.id,{notes:u});};
      const[editingEntry,setEditingEntry]=useState(null); // {idx, text}
      const saveEntryEdit=()=>{if(editingEntry===null)return;const u=[...timeline];u[editingEntry.idx]={...u[editingEntry.idx],text:editingEntry.text};onUpdate(job.id,{notes:u});setEditingEntry(null);};

      const handleInlineCustomerSave=async(data)=>{
        const nc=await onCreateCustomer(data);
        if(nc){setForm(f=>({...f,customerId:nc.id,serviceAddress:f.serviceAddress||nc.address||""}));}
        setShowInlineCustomer(false);
      };

      // ─── EDIT MODE ─────────────────────────────────────
      if(editing){
        return(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",justifyContent:"flex-end",zIndex:1000,backdropFilter:"blur(4px)"}} onClick={()=>setEditing(false)}>
            <div style={{width:"100%",maxWidth:540,background:"#0a0e13",borderLeft:"1px solid #1e2a35",height:"100%",overflow:"auto",padding:"28px",animation:"slideIn 0.2s ease"}} onClick={e=>e.stopPropagation()}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"24px"}}>
                <div><div style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#f97316",marginBottom:"4px"}}>{job.id}</div><h2 style={{margin:0,fontSize:"18px",color:"#e2e8f0"}}>Edit Work Order</h2></div>
                <button onClick={()=>setEditing(false)} style={{background:"none",border:"none",color:"#64748b",fontSize:"20px",cursor:"pointer"}}>✕</button>
              </div>
              <FormField label="Vehicle"><input value={form.vehicle} onChange={e=>set("vehicle",e.target.value)} style={inputStyle}/></FormField>
              <FormField label="VIN"><input value={form.vin} onChange={e=>set("vin",e.target.value)} style={inputStyle}/></FormField>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
                <FormField label="Customer">
                  <select value={form.customerId} onChange={e=>set("customerId",e.target.value)} style={inputStyle}>
                    <option value="">Select...</option>
                    {customers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                  <button onClick={()=>setShowInlineCustomer(!showInlineCustomer)} style={{background:"none",border:"none",color:"#f97316",fontSize:"11px",cursor:"pointer",marginTop:"6px",fontFamily:"'DM Mono',monospace"}}>+ Add New Customer</button>
                  {showInlineCustomer&&<InlineNewCustomer onSave={handleInlineCustomerSave} onCancel={()=>setShowInlineCustomer(false)}/>}
                </FormField>
                <FormField label="Job Type"><ServiceTypeSelect value={form.type} onChange={v=>set("type",v)} types={jobTypes} onAddType={addServiceType}/></FormField>
              </div>
              <FormField label="Service Address"><input value={form.serviceAddress} onChange={e=>set("serviceAddress",e.target.value)} placeholder="Address for this job" style={inputStyle}/></FormField>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
                <FormField label="ECU / Module"><input value={form.ecu} onChange={e=>set("ecu",e.target.value)} style={inputStyle}/></FormField>
                <FormField label="Priority"><select value={form.priority} onChange={e=>set("priority",e.target.value)} style={inputStyle}><option>High</option><option>Medium</option><option>Low</option></select></FormField>
              </div>
              <FormField label="Tools"><input value={form.tools} onChange={e=>set("tools",e.target.value)} style={inputStyle}/></FormField>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px"}}>
                <FormField label="Amount ($)"><input type="number" value={form.amount} onChange={e=>set("amount",e.target.value)} style={inputStyle}/></FormField>
                <FormField label="Date"><input type="date" value={form.date} onChange={e=>set("date",e.target.value)} style={inputStyle}/></FormField>
              </div>
              <div style={{display:"flex",gap:"10px",justifyContent:"flex-end",marginTop:"20px"}}><button onClick={()=>setEditing(false)} style={btnSecondary}>Cancel</button><button onClick={saveEdit} style={btnPrimary}>Save Changes</button></div>
            </div>
          </div>
        );
      }

      // ─── VIEW MODE ─────────────────────────────────────
      return(<>
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",justifyContent:"flex-end",zIndex:1000,backdropFilter:"blur(4px)"}} onClick={onClose}>
          <div style={{width:"100%",maxWidth:540,background:"#0a0e13",borderLeft:"1px solid #1e2a35",height:"100%",overflow:"auto",padding:"28px",animation:"slideIn 0.2s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"20px"}}>
              <div><div style={{fontFamily:"'DM Mono',monospace",fontSize:"12px",color:"#f97316",marginBottom:"4px"}}>{job.id}</div><h2 style={{margin:0,fontSize:"18px",color:"#e2e8f0"}}>{job.vehicle}</h2></div>
              <div style={{display:"flex",gap:"6px"}}><button onClick={startEdit} style={{background:"#1e2a35",border:"none",borderRadius:"6px",padding:"6px 12px",color:"#60a5fa",fontSize:"12px",cursor:"pointer",fontWeight:600,fontFamily:"'DM Mono',monospace"}}>✎ Edit</button><button onClick={onClose} style={{background:"none",border:"none",color:"#64748b",fontSize:"20px",cursor:"pointer"}}>✕</button></div>
            </div>
            <div style={{display:"flex",gap:"8px",marginBottom:"24px",flexWrap:"wrap"}}><StatusBadge status={job.status} balance={jobBal(job)}/><PriorityDot priority={job.priority}/></div>
            {[{label:"VIN",value:job.vin},{label:"Customer",value:job.customer},{label:"Service Address",value:job.serviceAddress,isAddress:true},{label:"Job Type",value:job.type},{label:"ECU / Module",value:job.ecu},{label:"Tools",value:job.tools},{label:"Date",value:job.date}].map(item=>(
              <div key={item.label} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #111820"}}>
                <span style={{fontSize:"12px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.6px",fontFamily:"'DM Mono',monospace"}}>{item.label}</span>
                <span style={{fontSize:"13px",color:"#cbd5e1",fontFamily:"'DM Mono',monospace",textAlign:"right",maxWidth:"60%"}}>{item.isAddress&&item.value?<AddressLink address={item.value}/>:(item.value||"—")}</span>
              </div>
            ))}

            {/* ─── SESSION TRACKING ──────────────────────────── */}
            <div style={{background:"#111820",borderRadius:"8px",padding:"14px 16px",marginTop:"16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:"11px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.6px",fontFamily:"'DM Mono',monospace",marginBottom:"4px"}}>Sessions</div>
                <div style={{fontSize:"16px",color:"#e2e8f0",fontWeight:600,fontFamily:"'DM Mono',monospace"}}>{job.sessionsCompleted||0} / {job.sessionsRequired||1}</div>
              </div>
              <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                <button onClick={()=>{const c=Math.max(0,(job.sessionsCompleted||0)-1);onUpdate(job.id,{sessionsCompleted:c});}} style={{background:"#1e2a35",border:"none",borderRadius:"6px",width:"32px",height:"32px",color:"#94a3b8",fontSize:"16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                <button onClick={()=>{const c=(job.sessionsCompleted||0)+1;onUpdate(job.id,{sessionsCompleted:c});}} style={{background:"#1e2a35",border:"none",borderRadius:"6px",width:"32px",height:"32px",color:"#4ade80",fontSize:"16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                <div style={{width:"1px",height:"24px",background:"#1e2a35",margin:"0 4px"}}/>
                <button onClick={()=>{const r=Math.max(1,(job.sessionsRequired||1)-1);onUpdate(job.id,{sessionsRequired:r});}} style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"6px",width:"28px",height:"28px",color:"#64748b",fontSize:"12px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                <span style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace"}}>needed</span>
                <button onClick={()=>{const r=(job.sessionsRequired||1)+1;onUpdate(job.id,{sessionsRequired:r});}} style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"6px",width:"28px",height:"28px",color:"#64748b",fontSize:"12px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
              </div>
            </div>

            {/* ─── PAYMENT TRACKING ──────────────────────────── */}
            <PaymentSection job={job} onUpdate={onUpdate}/>

            {/* ─── TIMELINE (Notes + Files) ──────────────────── */}
            <div style={{marginTop:"24px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
                <div style={{fontSize:"12px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.6px",fontFamily:"'DM Mono',monospace"}}>Activity Timeline</div>
                <button onClick={handleAttach} style={{background:"#1e2a35",border:"none",borderRadius:"6px",padding:"5px 10px",color:"#60a5fa",fontSize:"11px",cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>📎 Attach File</button>
              </div>
              <div style={{display:"flex",gap:"8px",marginBottom:"16px"}}>
                <textarea value={newNote} onChange={e=>setNewNote(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();addNote();}}} rows={2} placeholder="Add a note... (Enter to save)" style={{...inputStyle,flex:1,resize:"none",fontSize:"12px"}}/>
                <button onClick={addNote} disabled={!newNote.trim()} style={{...btnPrimary,padding:"8px 14px",fontSize:"12px",alignSelf:"flex-end",opacity:newNote.trim()?1:0.4}}>Add</button>
              </div>
              <div style={{display:"flex",flexDirection:"column"}}>
                {timeline.length===0&&<div style={{color:"#334155",fontSize:"12px",fontFamily:"'DM Mono',monospace",padding:"8px 0"}}>No activity yet</div>}
                {[...timeline].reverse().map((entry,i)=>{
                  const realIdx=timeline.length-1-i;
                  const isFile=entry.type==="file";
                  const fileExt=isFile?entry.file?.extension:"";
                  const icon=isFile?(FILE_ICONS[fileExt]||"📁"):"💬";
                  return(
                    <div key={i} style={{display:"flex",gap:"12px",padding:"12px 0",borderBottom:"1px solid #111820"}}>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"center",paddingTop:"2px",minWidth:"16px"}}>
                        <div style={{width:8,height:8,borderRadius:"50%",background:i===0?"#f97316":isFile?"#60a5fa":"#1e2a35",border:i===0?"none":`2px solid ${isFile?"#3b82f6":"#334155"}`,flexShrink:0}}/>
                        {i<timeline.length-1&&<div style={{width:1,flex:1,background:"#1e2a35",marginTop:"4px"}}/>}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace",marginBottom:"4px"}}>{icon} {formatNoteTime(entry.timestamp)}</div>
                        {isFile?(
                          <div>
                            {editingEntry&&editingEntry.idx===realIdx?(
                              <div style={{marginBottom:"6px"}}>
                                <textarea value={editingEntry.text} onChange={e=>setEditingEntry({...editingEntry,text:e.target.value})} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();saveEntryEdit();}if(e.key==="Escape")setEditingEntry(null);}} rows={2} autoFocus style={{...inputStyle,fontSize:"12px",resize:"none",marginBottom:"4px"}}/>
                                <div style={{display:"flex",gap:"6px"}}><button onClick={saveEntryEdit} style={{...btnPrimary,padding:"4px 10px",fontSize:"11px"}}>Save</button><button onClick={()=>setEditingEntry(null)} style={{...btnSecondary,padding:"4px 10px",fontSize:"11px"}}>Cancel</button></div>
                              </div>
                            ):(
                              entry.text&&!entry.text.startsWith("Attached: ")&&<div onDoubleClick={()=>setEditingEntry({idx:realIdx,text:entry.text})} style={{fontSize:"12px",color:"#e2e8f0",fontWeight:600,marginBottom:"6px",cursor:"pointer"}} title="Double-click to edit">{entry.text}</div>
                            )}
                            {["jpg","jpeg","png","gif","webp"].includes(fileExt)?(
                              <div>
                                <ImageThumb storedName={entry.file?.storedName} fileApi={fileApi} onClick={()=>openPreview(entry)} caption={null}/>
                                <div style={{display:"flex",alignItems:"center",gap:"8px",marginTop:"4px"}}>
                                  <span style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace",flex:1}}>{entry.file?.originalName} · {formatBytes(entry.file?.size)}</span>
                                  {!(editingEntry&&editingEntry.idx===realIdx)&&(!entry.text||entry.text.startsWith("Attached: "))&&<button onClick={()=>setEditingEntry({idx:realIdx,text:entry.text||""})} style={{background:"#1e2a35",border:"none",borderRadius:"4px",padding:"3px 8px",color:"#fbbf24",fontSize:"10px",cursor:"pointer"}}>+ Note</button>}
                                  <button onClick={()=>openPreview(entry)} style={{background:"#1e2a35",border:"none",borderRadius:"4px",padding:"3px 8px",color:"#60a5fa",fontSize:"10px",cursor:"pointer"}}>Preview</button>
                                  <button onClick={()=>fileApi.open(entry.file?.storedName)} style={{background:"#1e2a35",border:"none",borderRadius:"4px",padding:"3px 8px",color:"#94a3b8",fontSize:"10px",cursor:"pointer"}}>Open</button>
                                </div>
                              </div>
                            ):(
                            <div onClick={()=>openPreview(entry)} style={{background:"#0f1419",border:"1px solid #1e2a35",borderRadius:"6px",padding:"10px 12px",display:"flex",alignItems:"center",gap:"10px",cursor:"pointer"}} onMouseOver={e=>e.currentTarget.style.borderColor="#2a4a6a"} onMouseOut={e=>e.currentTarget.style.borderColor="#1e2a35"}>
                              <span style={{fontSize:"20px"}}>{FILE_ICONS[fileExt]||"📁"}</span>
                              <div style={{flex:1,minWidth:0}}>
                                <div style={{fontSize:"12px",color:"#e2e8f0",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{entry.file?.originalName}</div>
                                <div style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace"}}>{fileExt.toUpperCase()} · {formatBytes(entry.file?.size)} · Click to preview</div>
                              </div>
                              {!(editingEntry&&editingEntry.idx===realIdx)&&(!entry.text||entry.text.startsWith("Attached: "))&&<button onClick={(e)=>{e.stopPropagation();setEditingEntry({idx:realIdx,text:entry.text||""});}} style={{background:"#1e2a35",border:"none",borderRadius:"4px",padding:"4px 8px",color:"#fbbf24",fontSize:"10px",cursor:"pointer"}}>+ Note</button>}
                              <button onClick={(e)=>{e.stopPropagation();fileApi.open(entry.file?.storedName);}} style={{background:"#1e2a35",border:"none",borderRadius:"4px",padding:"4px 8px",color:"#60a5fa",fontSize:"10px",cursor:"pointer"}}>Open</button>
                              <button onClick={(e)=>{e.stopPropagation();fileApi.showInFolder(entry.file?.storedName);}} style={{background:"#1e2a35",border:"none",borderRadius:"4px",padding:"4px 8px",color:"#94a3b8",fontSize:"10px",cursor:"pointer"}}>Folder</button>
                            </div>
                            )}
                          </div>
                        ):(
                          editingEntry&&editingEntry.idx===realIdx?(
                            <div>
                              <textarea value={editingEntry.text} onChange={e=>setEditingEntry({...editingEntry,text:e.target.value})} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();saveEntryEdit();}if(e.key==="Escape")setEditingEntry(null);}} rows={3} autoFocus style={{...inputStyle,fontSize:"12px",resize:"vertical",marginBottom:"4px"}}/>
                              <div style={{display:"flex",gap:"6px"}}><button onClick={saveEntryEdit} style={{...btnPrimary,padding:"4px 10px",fontSize:"11px"}}>Save</button><button onClick={()=>setEditingEntry(null)} style={{...btnSecondary,padding:"4px 10px",fontSize:"11px"}}>Cancel</button></div>
                            </div>
                          ):(
                            <div onDoubleClick={()=>setEditingEntry({idx:realIdx,text:entry.text||""})} style={{fontSize:"13px",color:"#cbd5e1",lineHeight:1.5,whiteSpace:"pre-wrap",wordBreak:"break-word",cursor:"pointer"}} title="Double-click to edit">{entry.text}</div>
                          )
                        )}
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:"4px",alignSelf:"flex-start",paddingTop:"2px"}}>
                        <button onClick={()=>setEditingEntry({idx:realIdx,text:entry.text||""})} style={{background:"none",border:"none",color:"#475569",cursor:"pointer",fontSize:"11px",padding:"0 2px"}} title="Edit">✎</button>
                        <button onClick={()=>deleteTimelineEntry(realIdx)} style={{background:"none",border:"none",color:"#334155",cursor:"pointer",fontSize:"13px",padding:"0 2px"}} title="Delete">✕</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Status */}
            <div style={{marginTop:"20px"}}>
              <div style={{fontSize:"12px",color:"#64748b",textTransform:"uppercase",letterSpacing:"0.6px",fontFamily:"'DM Mono',monospace",marginBottom:"8px"}}>Update Status</div>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                {Object.keys(STATUS_COLORS).map(s=>(<button key={s} onClick={()=>{const sc=STATUS_COLORS[s];fireConfetti(sc.dot);onUpdate(job.id,{status:s});}} style={{background:job.status===s?STATUS_COLORS[s].bg:"#111820",border:`1px solid ${job.status===s?STATUS_COLORS[s].dot:"#1e2a35"}`,borderRadius:"6px",padding:"6px 10px",color:job.status===s?STATUS_COLORS[s].text:"#475569",fontSize:"11px",cursor:"pointer",fontWeight:job.status===s?600:400}}>{s}</button>))}
              </div>
            </div>
            <div style={{display:"flex",gap:"10px",marginTop:"24px"}}>
              <button onClick={()=>{if(confirm("Delete this work order?")){onDelete(job.id);onClose();}}} style={{...btnDanger,flex:1}}>Delete Work Order</button>
              <button onClick={()=>setShowInvoice(true)} style={{flex:1,background:"#1a2a3a",border:"1px solid #2a4a6a",borderRadius:"8px",padding:"12px",color:"#60a5fa",fontSize:"13px",cursor:"pointer",fontWeight:700}}>📄 Generate Invoice</button>
            </div>
          </div>
        </div>
        {showInvoice&&<InvoiceModal job={job} customers={customers} onClose={()=>setShowInvoice(false)} isServer={isServer}/>}

        {showAttachModal&&(
          <Modal onClose={()=>{setShowAttachModal(false);setStagedFiles([]);}} title="Attach Files" width={440}>
            <div style={{padding:"16px 0"}}>
              <div style={{marginBottom:"14px"}}>
                {stagedFiles.map((f,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:"10px",padding:"8px 12px",background:"#111820",borderRadius:"6px",marginBottom:"4px"}}>
                    <span style={{fontSize:"16px"}}>{FILE_ICONS[f.extension]||"📁"}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:"12px",color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.originalName}</div>
                      <div style={{fontSize:"10px",color:"#475569",fontFamily:"'DM Mono',monospace"}}>{f.extension?.toUpperCase()} · {formatBytes(f.size)}</div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{marginBottom:"14px"}}>
                <div style={{fontSize:"11px",color:"#64748b",marginBottom:"6px",fontFamily:"'DM Mono',monospace",textTransform:"uppercase",letterSpacing:"0.5px"}}>Note / Description</div>
                <textarea value={attachComment} onChange={e=>setAttachComment(e.target.value)} placeholder="Add a note about these files..." rows={3} style={{...inputStyle,resize:"vertical",fontSize:"13px"}}/>
              </div>
              <div style={{display:"flex",gap:"10px"}}>
                <button onClick={()=>{setShowAttachModal(false);setStagedFiles([]);}} style={{...btnSecondary,flex:1}}>Cancel</button>
                <button onClick={confirmAttach} style={{...btnPrimary,flex:1}}>Attach {stagedFiles.length} File{stagedFiles.length!==1?"s":""}</button>
              </div>
            </div>
          </Modal>
        )}

        {previewFile&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:2000,display:"flex",flexDirection:"column",animation:"fadeIn 0.15s"}} onClick={()=>setPreviewFile(null)}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 20px",flexShrink:0}} onClick={e=>e.stopPropagation()}>
              <div>
